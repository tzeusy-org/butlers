<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dispatch-mark.svg" />
    <!-- viewport-fit=cover (bu-8cdl1.13): without it env(safe-area-inset-*)
         resolves to 0 on notched/home-indicator phones, so the page-gutter
         ramp's safe-area padding would be a permanent no-op. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        const root = document.documentElement
        let theme = "dark"
        try {
          const storedTheme = window.localStorage.getItem("theme")
          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") {
            theme = storedTheme
          }
        } catch {
          // Storage can be unavailable in private or sandboxed contexts.
        }
        const resolvedTheme = theme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : theme
        root.classList.toggle("dark", resolvedTheme === "dark")
        root.classList.toggle("light", resolvedTheme === "light")
      })()
    </script>
    <title>Butlers Dispatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
