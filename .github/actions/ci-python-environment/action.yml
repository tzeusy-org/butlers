name: CI Python environment
description: Set up pinned Python and uv; repair the frozen checkout environment for execution jobs.
runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: 3.12.15
    - name: Install uv
      run: python3 scripts/install_ci_uv.py
      shell: bash
    - name: Compute exact environment cache key
      if: github.job != 'route'
      id: environment-key
      run: |
        set -euo pipefail
        cache_key="$(python3 scripts/ci_environment.py key)"
        printf 'key=%s\n' "$cache_key" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore advisory environment cache
      if: github.job != 'route'
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: .venv
        key: ${{ steps.environment-key.outputs.key }}
    - name: Install dependencies
      if: github.job != 'route'
      run: python3 scripts/ci_environment.py prepare
      shell: bash
