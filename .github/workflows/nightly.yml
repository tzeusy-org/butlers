          def finish_group(process):
              # Popen(start_new_session=True) owns this PGID. WNOWAIT reserves the
              # direct leader's identity until the LAST nonzero group signal.
              pgid = process.pid
              ack = {"direct_leader_reaped": False, "owned_group_absent": False,
                     "identity_reserved_through_final_signal": False,
                     "signal_error": False, "absence_probe": "UNKNOWN",
                     "cleanup_status": "UNKNOWN"}
              try:
                  os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                  try:
                      os.killpg(pgid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  except OSError:
                      ack["signal_error"] = True
                  grace = time.monotonic() + 5
                  while time.monotonic() < grace:
                      if os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT):
                          break
                      time.sleep(0.02)
                  # A lost/ambiguous child identity refuses any further nonzero signal.
                  os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                  try:
                      os.killpg(pgid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  except OSError:
                      ack["signal_error"] = True
                  ack["identity_reserved_through_final_signal"] = True
              except (ChildProcessError, OSError):
                  return ack
          
              # One post-KILL5s envelope covers BOTH direct reaping and group absence.
              # After process.wait releases leader identity, NEVER send a nonzero signal.
              post_kill_deadline = time.monotonic() + 5
              try:
                  process.wait(timeout=max(0, post_kill_deadline - time.monotonic()))
                  ack["direct_leader_reaped"] = True
              except (subprocess.TimeoutExpired, ChildProcessError, OSError):
                  return ack
              while time.monotonic() < post_kill_deadline:
                  try:
                      os.killpg(pgid, 0)
                  except ProcessLookupError:
                      ack["owned_group_absent"] = True
                      ack["absence_probe"] = "ProcessLookupError"
                      break
                  except OSError:
                      # Permission, identity ambiguity or unexpected errors are UNKNOWN.
                      return ack
                  # Presence is not identity proof; only bounded zero-signal probes follow.
                  remaining = post_kill_deadline - time.monotonic()
                  if remaining > 0:
                      time.sleep(min(0.02, remaining))
              if (ack["direct_leader_reaped"] and ack["owned_group_absent"]
                      and ack["identity_reserved_through_final_signal"]
                      and not ack["signal_error"]):
                  ack["cleanup_status"] = "COMPLETE"
              return ack
          
          
          def run_child(mode, receipt, deadline, attempts):
              command = [sys.executable, str(Path(__file__).resolve()), "child", mode, str(receipt)]
              attempt = {"mode": mode, "started": False, "child_reaped": False,
                         "owned_group_absent": False, "cleanup_status": "UNKNOWN",
                         "owned_group_signalled_before_leader_reap": False}
              attempts.append(attempt)
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         start_new_session=True)
              attempt["started"] = True
              raw = bytearray()
              complete = False
              try:
                  assert process.stdout is not None
                  with selectors.DefaultSelector() as selector:
                      selector.register(process.stdout, selectors.EVENT_READ)
                      while time.monotonic() < deadline and not INTERRUPTED:
                          for key, _ in selector.select(timeout=min(0.2, max(0, deadline-time.monotonic()))):
                              data = os.read(key.fd, 65536)
                              if not data:
                                  complete = True
                                  break
                              raw.extend(data)
                              if len(raw) > 4 * 1024 * 1024:
                                  raise RuntimeError("output_cap")
                          if complete:
                              break
                  if not complete:
                      raise RuntimeError("execution_deadline")
                  while os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT) is None:
                      if time.monotonic() >= deadline or INTERRUPTED:
                          raise RuntimeError("execution_deadline")
                      time.sleep(0.02)
              finally:
                  cleanup = finish_group(process)
                  attempt["cleanup"] = cleanup
                  attempt["child_reaped"] = cleanup["direct_leader_reaped"]
                  attempt["owned_group_absent"] = cleanup["owned_group_absent"]
                  attempt["cleanup_status"] = cleanup["cleanup_status"]
                  attempt["owned_group_signalled_before_leader_reap"] = (
                      cleanup["identity_reserved_through_final_signal"] and not cleanup["signal_error"])
                  if receipt.is_file():
                      state = json.loads(receipt.read_text())
                      state["owned_group_cleanup"] = cleanup
                      receipt.write_text(json.dumps(state, sort_keys=True) + "\n")
              code = process.returncode
              summaries = re.findall(
                  r"^=*\s*1 (passed|failed)(?:, \d+ warnings?)? in [\d.]+s[^\r\n]*$",
                  re.sub(r"\x1b\[[0-9;]*m", "", raw.decode(errors="replace")), re.MULTILINE,
              )
              return code, {"output_sha256": sha(raw), "output_bytes": len(raw),
                            "terminal": summaries[-1] if summaries else "UNKNOWN",
                            "process_reaped": cleanup["direct_leader_reaped"],
                            "owned_group_absent": cleanup["owned_group_absent"],
                            "owned_group_cleanup": cleanup}
          
          
          def driver(output):
              assert os.environ["GITHUB_REF"] == "refs/heads/agent/bu-fvw4ap.9-sql-controls-once"
              assert re.fullmatch("[0-9a-f]{40}", os.environ["GITHUB_SHA"])
              output = Path(output)
              output.mkdir(parents=True, exist_ok=False)
              report = {"status": "UNKNOWN", "allocation": "temporary NEVER-MERGE DRAFT PR + existing nightly workflow_dispatch",
                        "control_workflow_commit": os.environ["GITHUB_SHA"],
                        "control_workflow_ref": os.environ["GITHUB_REF"],
                        "binding": binding(), "sequence": [], "attempts": [], "no_broad_population_or_local_privilege": True,
                        "prior_positive_run": 41379413442,
                        "prior_positive_executed": "ed8b0ca13c865a23f087f2f9756d978f653d639f",
                        "prior_positive_manifest_sha256": "196a8249255351401dc3a56242bcdc9d5a9cee9c71e62abcbb87737010155375",
                        "native_cleanup_if_timeout": "UNKNOWN; no PASS without normal teardown"}
              deadline = time.monotonic() + 600  # One finite whole four-phase execution budget.
              try:
                  for mode in MODES:
                      receipt = output / (mode + ".json")
                      code, terminal = run_child(mode, receipt, deadline, report["attempts"])
                      state = json.loads(receipt.read_text())
                      expected_exit = 1 if mode in EXPECTED else 0
                      expected_call = "failed" if mode in EXPECTED else "passed"
                      good = (code == expected_exit == state["pytest_exit"]
                              and terminal["process_reaped"] and terminal["owned_group_absent"]
                              and terminal["owned_group_cleanup"]["cleanup_status"] == "COMPLETE"
                              and state["owned_group_cleanup"] == terminal["owned_group_cleanup"]
                              and state["collected_exact_one"] and state["real_asyncpg_pool"]
                              and state["production_imports_own_source"] and state["pool_closed_after_teardown"]
                              and state["phases"] == {"setup": "passed", "call": expected_call,
                                                       "teardown": "passed"}
                              and not state["observer_failure"]
                              and state["binding_before"] == state["binding_after"] == report["binding"]
                              and terminal["terminal"] == ("failed" if mode in EXPECTED else "passed")
                              and (state["positioned_assertion"] if mode in EXPECTED else True))
                      report["sequence"].append({"mode": mode, "child_exit": code, **terminal,
                                                 "verdict": "ASSERTION_RED" if good and mode in EXPECTED
                                                 else "PASS" if good else "UNKNOWN"})
                      if not good:
                          raise RuntimeError("control_not_proven")
                  if not (len(report["attempts"]) == 4 and all(
                          a["started"] and a["child_reaped"] and a["owned_group_absent"]
                          and a["cleanup_status"] == "COMPLETE" for a in report["attempts"])):
                      raise RuntimeError("owned_cleanup_unknown")
                  report["status"] = "CONTROLS_PROVEN"
              except Exception:
                  report["status"] = "UNKNOWN"
              finally:
                  report["binding_after"] = binding()
                  started = [a for a in report["attempts"] if a["started"]]
                  report["started_owned_groups"] = len(started)
                  report["all_owned_child_processes_reaped"] = bool(started) and all(
                      a["child_reaped"] for a in started)
                  report["all_owned_process_groups_absent"] = bool(started) and all(
                      a["owned_group_absent"] for a in started)
                  report["all_started_owned_cleanup_proven"] = bool(started) and all(
                      a["child_reaped"] and a["owned_group_absent"]
                      and a["cleanup_status"] == "COMPLETE" for a in started)
                  if report["status"] == "CONTROLS_PROVEN" and not (
                          len(started) == 4 and report["all_started_owned_cleanup_proven"]):
                      report["status"] = "UNKNOWN"
                  report["native_fixture_teardown_complete"] = (
                      len(report["sequence"]) == 4 and report["status"] == "CONTROLS_PROVEN"
                      and report["all_started_owned_cleanup_proven"])
                  (output / "report.json").write_text(json.dumps(report, sort_keys=True) + "\n")
                  print(json.dumps({"status": report["status"], "phases": len(report["sequence"])}))
              return 0 if report["status"] == "CONTROLS_PROVEN" else 1
          
          
          if __name__ == "__main__":
              if sys.argv[1] == "child":
                  raise SystemExit(child(sys.argv[2], sys.argv[3]))
              assert sys.argv[1] == "run"
              def interrupted(signum, frame):
                  global INTERRUPTED
                  INTERRUPTED = True  # Defer until Popen ownership exists; finally joins.
              signal.signal(signal.SIGTERM, interrupted)
              signal.signal(signal.SIGINT, interrupted)
              try:
                  result = driver(sys.argv[2])
              except Exception:
                  print(json.dumps({"status": "UNKNOWN", "reason": "driver_or_binding_failure"}))
                  result = 1
              raise SystemExit(result)
          FLEET9_DRIVER
          test "$(sha256sum "$RUNNER_TEMP/fleet9_control_driver.py" | cut -d ' ' -f 1)" = 'd47260243b4dfd78518dfc9b2a646bb2ff527273bd561d7591ea9d57d7ff048e'
      - name: Three native SQL inverses once each, then restored exact node once
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 610s .venv/bin/python \
            "$RUNNER_TEMP/fleet9_control_driver.py" run "$RUNNER_TEMP/fleet9-closed-controls"
      - name: Retain only closed source-bound control outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet9-native-sql-controls-closed
          path: ${{ runner.temp }}/fleet9-closed-controls/*.json
          if-no-files-found: error
          retention-days: 3
