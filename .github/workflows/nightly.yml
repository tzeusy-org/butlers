          FROZEN = {'.github/workflows/nightly.yml': 'de1d27f96ef4361e9bd7b3ac11a73c6d4731058462686925c9597636c7e5f135', '.github/workflows/ci.yml': '9bf6bf71c27a31318c719f8e789445691eabac1c3b23f7289bc932c27a028482', '.github/actions/ci-python-environment/action.yml': '0efa8c486bfc721cb0a3fffb6252b92ea1f429571978c91310922c627dc5c962', 'conftest.py': '14bed9841dc14a3e65be3d2f51e30830ffe3e949814535e768b573642a16a531', 'pyproject.toml': '264c41f3017c9676343f3519e656130dc49f7b4e97859623208e28be86697c33', 'uv.lock': '44089f7eee0ce93866f7b2576bfb944e86771536c97e67be46251522a0e7856b', 'scripts/install_ci_uv.py': 'aca2349b4579f4f67242b8bfc8f4679515005a437e393b5f488cb1cdfad6ae8c', 'scripts/ci_environment.py': '81d2f5701c376fd52bd51772e3b874b7b81a722259d2fea4427fd471ae4bce64', 'src/butlers/api/readiness.py': 'd7f88d43eb4a56062e6b47128936b3926961f08e00f553c937c43d4d659c6c77', 'src/butlers/core/qa/patrol_provenance.py': '28e89cdf77400108c1396934f39606933eaab2c79dd1068919feeaf8e4f6e3da', 'tests/integration/test_infra_state_views_migration.py': 'eef0a39afe8d0cc4951354a9d4cd0fe5044b31c5ee0e2d822cba83a6fdab6d60'}
          EXPECTED = {
