name: Nightly Tests

on:
  schedule:
    # Run daily at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      freeze-clock-control:
        description: Deliberate branch red; no scheduled-night credit
        type: boolean
        default: false
      minute-old-cron-control:
        description: Neutralize only PR4310 in the isolated minute conformance; no scheduled-night credit
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  nightly:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if timeout 120 bash -c 'set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh'; then
              echo "uv installed on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::uv install failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "uv install attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Nightly schema-matrix and migration tests
        # bu-y189y: parenthesized "and not bench and not perf" keeps this
        # lane's opt-in nightly/integration selection from also sweeping in
        # perf-marked tests (e.g. test_audit_log_index_perf.py, which is
        # `pytest.mark.perf` + `pytest.mark.integration` and is documented as
        # opt-in only via an explicit `-m perf` run).
        run: |
          export NIGHTLY_LOGICAL_DATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at[:10]')
          uv run --no-sync python scripts/run_nightly_assurance.py --variant schema --output .tmp/nightly-evidence/schema
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GH_TOKEN: ${{ github.token }}

      - name: Retain sanitized schema evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}-schema
          path: .tmp/nightly-evidence/schema/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  faketime-matrix:
    # bu-10fgt.4: catches wall-clock time-bomb tests -- fixtures/business logic
    # that freeze one clock reading (e.g. a fixture-computed "_NOW") while
    # comparing it against a fresh datetime.now()/date.today() call elsewhere,
    # so the test only fails once real wall-clock time drifts past whatever
    # date was baked in at authoring time (bu-10fgt.1's relationship binning
    # tests, bu-10fgt.3's frozen-date sweep, bu-39t2s's midnight-rollover
    # travel tests). Running the suite with the process clock pushed forward
    # surfaces the *next* one of these before it detonates on main at its real
    # trigger date, instead of after.
    #
    # Mechanism: libfaketime intercepts libc time syscalls via LD_PRELOAD, so
    # it fakes time.time()/datetime.now()/date.today() for the pytest process
    # tree. It deliberately does NOT touch the monotonic clock, so
    # asyncio sleep/timeout semantics are unaffected (verified locally: a
    # faked process still measures asyncio.sleep(0.2) as ~0.2s of monotonic
    # time while datetime.now() reports the shifted date). Postgres runs as a
    # separate service container whose own clock is NOT shifted -- SQL
    # NOW()/CURRENT_TIMESTAMP stays real -- so this catches the Python-level
    # frozen-fixture class above, not a DB-side clock skew.
    #
    # Scheduled/dispatch-only by design: this must never gate PR merges or
    # slow the required `check` job, only surface future hazards early. A
    # Source-owned sanitized evidence additionally feeds the trusted host
    # coordinator. CI evidence transport has no Beads/DB credential bridge.
    #
    # bu-hmdqz.8: run 29140308642 (first scheduled run) proved the detector
    # works -- it surfaced real +45d wall-clock time-bomb failures within ~20
    # minutes -- then both matrix legs hung at 99% progress until GitHub's 6h
    # job-level kill, which concludes the job 'cancelled' rather than
    # 'failure'. That silently defeats the scheduled-workflow-failure email
    # this job's alerting depends on, burns ~12h of runner time nightly, and
    # destroys the pytest summary before it can name the hung/failing test.
    # timeout-minutes below bounds the whole-job hang; the per-test
    # --timeout in the run step (pytest-timeout) turns an individual stuck
    # test into a named failure instead of a silent job-wide stall.
    #
    # bu-ik7p3: per-test --timeout=300 --timeout-method=thread was NOT enough.
    # Runs 29208931855 (51%) and 29212168922 (both legs, 99%) still wedged
    # mid/late-suite and burned to the job-level cancel with the per-test
    # timer never firing. Root shape: the stall is OUTSIDE the test-call phase
    # pytest-timeout guards -- it lives in xdist worker/session shutdown or a
    # session-scoped fixture finalizer (e.g. the once-per-worker
    # `postgres_container` testcontainer teardown at ~99%, Ryuk disabled), so
    # no per-item timer covers it and `--session-timeout` (checked only
    # between items) can't interrupt it either. A GitHub job-level cancel
    # concludes 'cancelled' not 'failure', silently defeating the
    # scheduled-workflow-failure email this job's alerting depends on, and
    # leaves NO stacks to locate the wedge. The run step below wraps pytest in
    # a coreutils `timeout --signal=ABRT` watchdog + PYTHONFAULTHANDLER=1 so a
    # future wedge SIGABRTs the whole process group (controller + every xdist
    # worker), each dumping all-thread native+Python stacks to the log, then
    # exits non-zero (a real 'failure', not a silent cancel) -- turning the
    # next hang into actionable stacks well inside this budget. timeout-minutes
    # is the outer backstop should the watchdog itself be defeated.
    timeout-minutes: 75
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        offset: ["+45d", "+120d"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if timeout 120 bash -c 'set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh'; then
              echo "uv installed on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::uv install failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "uv install attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Install libfaketime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends faketime

      - name: Free disk space before testcontainers
        # Same rationale as ci.yml's check job: testcontainers pulls
        # pgvector/pgvector:pg17 and the runner only starts with ~14 GB free.
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean -q
          docker image prune -f --filter "until=1h" || true

      - name: Full suite at faketime offset ${{ matrix.offset }}
        run: |
          LIBFAKETIME_SO=$(dpkg -L libfaketime | grep -m1 '/libfaketime\.so\.1$')
          export NIGHTLY_LOGICAL_DATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at[:10]')
          uv run --no-sync python scripts/run_nightly_assurance.py \
            --variant "${VARIANT}" --library "${LIBFAKETIME_SO}" \
            --output ".tmp/nightly-evidence/${VARIANT}"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.offset == '+45d' && 'offset-45' || 'offset-120' }}
          BUTLERS_NIGHTLY_FROZEN_CONFORMANCE: ${{ github.event_name == 'workflow_dispatch' && inputs['freeze-clock-control'] && '1' || '0' }}

      - name: Retain sanitized offset evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.offset == '+45d' && 'offset-45' || 'offset-120' }}
          path: .tmp/nightly-evidence/${{ matrix.offset == '+45d' && 'offset-45' || 'offset-120' }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  exact-image-sandbox:
    timeout-minutes: 30
    # bu-zfmq2: task 3.6b's real-kernel exact-image proof
    # (test_exact_image_bubblewrap_handshake_runs_only_when_explicitly_enabled)
    # only runs when BUTLERS_RUN_EXACT_IMAGE_SANDBOX_TEST=1 names an explicitly
    # rebuilt, non-latest image -- no workflow set that before, so the launch/
    # pidfd-termination proof against a real Bubblewrap sandbox and the exact
    # production container never executed anywhere. It rebuilds the exact
    # base+app image chain (mirroring scripts/compose.sh's fingerprint/label
    # and GIT_SHA build-arg conventions) and spawns real, unprivileged
    # Bubblewrap inside it, so this is deliberately its own slower nightly
    # lane rather than every PR's fast gate.
    # bu-q6vjl: also runs the adversarial fork/double-fork/setsid
    # descendant-survival proof
    # (test_exact_image_bubblewrap_sandbox_kills_detached_descendants_before_persistence)
    # against the same exact image, for the same reason -- task 3.6b's
    # descendant-survival/mutation-after-exit/persistence guarantees had no
    # real-kernel test anywhere in the repo either.
    #
    # bu-dq46e: task 3.6b also requires proving concurrent peer isolation --
    # that one sandboxed child cannot read or write another's stage or
    # inspect its process state. test_exact_image_concurrent_sandboxes_cannot_read_write_or_inspect_each_other
    # runs under the same gate and shares this job's already-built image, so
    # it is added to the same -k selection below rather than its own job.
    # bu-xj2gi: also runs the adversarial signer/protected-environment
    # isolation proof
    # (test_exact_image_bubblewrap_sandbox_denies_signer_and_protected_environment)
    # against the same exact image -- spec.md's ENOENT-on-signer and
    # protected-parent-environment guarantees had no real-kernel test
    # anywhere in the repo either.
    # The complete original four-test corpus passed on this standard runner.
    # Ubuntu 24.04 failed the same unprivileged UID-map launch; this keeps all
    # security settings unchanged and does not isolate the kernel cause.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if timeout 120 bash -c 'set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh'; then
              echo "uv installed on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::uv install failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "uv install attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Free disk space before image builds
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean -q
          docker image prune -f --filter "until=1h" || true

      - name: Build butlers-base image
        # Labels mirror scripts/compose.sh's freshness receipt so this stays
        # provably the same base-image build contract production uses.
        run: |
          # shellcheck source=scripts/base-image-input-fingerprint.sh
          source scripts/base-image-input-fingerprint.sh
          BASE_DOCKERFILE_SHA=$(sha256sum < Dockerfile.base | awk '{print $1}')
          BASE_INPUT_SHA=$(butlers_base_image_input_fingerprint \
            Dockerfile.base \
            scripts/runtime_cli_sandbox_init.c \
            scripts/generate_runtime_cli_sandbox_manifest.py)
          docker build \
            --label "butlers.base.dockerfile_sha=${BASE_DOCKERFILE_SHA}" \
            --label "butlers.base.input_sha=${BASE_INPUT_SHA}" \
            -f Dockerfile.base \
            -t butlers-base:latest .

      - name: Build butlers-app exact image
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          DOCKER_BUILDKIT=1 docker build --build-arg GIT_SHA="${GIT_SHA}" \
            -t "butlers-app:${GIT_SHA}" .

      - name: Exact-image Bubblewrap sandbox proof
        run: |
          export NIGHTLY_LOGICAL_DATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at[:10]')
          uv run --no-sync python scripts/run_nightly_assurance.py --variant exact-image \
            --output .tmp/nightly-evidence/exact-image
        env:
          BUTLERS_RUN_EXACT_IMAGE_SANDBOX_TEST: "1"
          BUTLERS_RUNTIME_SANDBOX_IMAGE: butlers-app:${{ github.sha }}
          GH_TOKEN: ${{ github.token }}

      - name: Retain sanitized exact-image evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}-exact-image
          path: .tmp/nightly-evidence/exact-image/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  folded-clock:
    # Skipped/unknown folded jobs never count as a complete green night.
    needs: [nightly, faketime-matrix, exact-image-sandbox]
    if: >-
      always() && needs.nightly.result == 'success' &&
      needs.faketime-matrix.result == 'success' &&
      needs.exact-image-sandbox.result == 'success'
    timeout-minutes: 75
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [hour, minute]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if timeout 120 bash -c 'set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh'; then
              echo "uv installed on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::uv install failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "uv install attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Install libfaketime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends faketime

      - name: Free disk space before testcontainers
        # Same rationale as ci.yml's check job: testcontainers pulls
        # pgvector/pgvector:pg17 and the runner only starts with ~14 GB free.
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean -q
          docker image prune -f --filter "until=1h" || true

      - name: Full suite and positioned folded boundary
        run: |
          LIBFAKETIME_SO=$(dpkg -L libfaketime | grep -m1 '/libfaketime\.so\.1$')
          export NIGHTLY_LOGICAL_DATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at[:10]')
          uv run --no-sync python scripts/run_nightly_assurance.py \
            --variant "folded-${PHASE}" --library "${LIBFAKETIME_SO}" \
            --output ".tmp/nightly-evidence/folded-${PHASE}"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ matrix.phase }}
          BUTLERS_NIGHTLY_QA_OLD_CRON_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs['minute-old-cron-control'] && '1' || '0' }}

      - name: Retain sanitized folded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}-folded-${{ matrix.phase }}
          path: .tmp/nightly-evidence/folded-${{ matrix.phase }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  assess-nightly:
    needs: [nightly, faketime-matrix, exact-image-sandbox, folded-clock]
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: nightly-assurance-evidence-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Provisional evidence assessment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python scripts/assess_nightly_assurance.py \
            --run-id "${GITHUB_RUN_ID}" --publish-evidence \
            --output .tmp/nightly-assessment.json
      - name: Retain assessor receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}-assessment
          path: .tmp/nightly-assessment.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
