              assert Path(readiness.__file__).resolve() == Path("src/butlers/api/readiness.py").resolve()
              import butlers.core.qa.patrol_provenance as provenance
              assert Path(provenance.__file__).resolve() == Path("src/butlers/core/qa/patrol_provenance.py").resolve()
              state = {"mode": mode, "production_imports_own_source": True, "binding_before": binding(), "collected_exact_one": False,
                       "phases": {}, "observer_failure": False, "positioned_assertion": False}
              original = LAST_QUALIFYING_PATROL_SQL
              substitutions = {
                  "completeness": ("      AND discovery_complete IS TRUE\n", ""),
                  "digest": ("      AND enabled_sources_config_digest = $2\n",
                             "      AND $2::text IS NOT NULL\n"),
                  "newest-any-row": (original, "SELECT max(completed_at) FROM public.qa_patrols "
                                     "WHERE $1::text[] IS NOT NULL AND $2::text IS NOT NULL"),
              }
              candidate = original
              if mode in substitutions:
                  old, new = substitutions[mode]
                  assert original.count(old) == 1
                  candidate = original.replace(old, new)
              else:
                  assert mode == "restored"
              readiness.LAST_QUALIFYING_PATROL_SQL = candidate
              state["original_SQL_sha256"] = sha(original.encode())
              state["effective_SQL_sha256"] = sha(candidate.encode())
          
              class Observer:
                  def pytest_collection_finish(self, session):
                      state["collected_exact_one"] = [item.nodeid for item in session.items] == [NODE]
          
                  @pytest.hookimpl(hookwrapper=True)
                  def pytest_runtest_makereport(self, item, call):
                      outcome = yield
                      try:
                          report = outcome.get_result()
                          assert item.nodeid == NODE
                          state["phases"][report.when] = report.outcome
                          if report.when == "call":
                              state["real_asyncpg_pool"] = isinstance(
                                  item.funcargs["fleet_readiness_env"].pool, asyncpg.Pool
