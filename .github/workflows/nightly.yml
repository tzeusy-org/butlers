                          if report.when == "teardown":
                              state["pool_closed_after_teardown"] = (
                                  getattr(item.funcargs["fleet_readiness_env"].pool, "_closed", None) is True)
                          if mode in EXPECTED and call.excinfo is not None:
                              line, key, value = EXPECTED[mode]
