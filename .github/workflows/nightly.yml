# UNEXECUTED THROWAWAY-REF DRAFT. Never merge this replacement workflow.
# ROOT must review its exact commit and allocate one dispatch before execution.
name: Nightly Tests
on:
  workflow_dispatch:
    inputs:
      subject_head:
        description: Fixed original pg-clock subject; no arbitrary source
        required: true
        type: choice
        options: [4cbf30c8e7290e7c86fd38ce9502820b70b88f5a]
      offset:
        description: One reviewed diagnostic offset; not normal shifted admission
        required: true
        type: choice
        options: ['+45d']
permissions:
  contents: read
concurrency:
  group: pg-clock12-scoped-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  pg-clock12-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    env:
      # Same disposable synthetic service as the original; root fixture still
      # creates its unchanged, shared shifted pgvector/pg17 container.
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 4cbf30c8e7290e7c86fd38ce9502820b70b88f5a
          path: subject
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.15'
      - name: Admit exact diagnostic ref, source and one-shot inputs
        shell: bash
        env:
          SUBJECT_HEAD: ${{ inputs.subject_head }}
          OFFSET: ${{ inputs.offset }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$SUBJECT_HEAD" = 4cbf30c8e7290e7c86fd38ce9502820b70b88f5a
          test "$OFFSET" = +45d
          test "$(git -C observer rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_HEAD"
          test "$(git -C subject rev-parse HEAD^{tree})" = 8f91eb7ab6d627152d4abafd78bc7af52890a23e
          test -z "$(git -C subject status --porcelain)"
      - name: Existing finite UV installer
        working-directory: subject
        timeout-minutes: 11
        run: python3 scripts/install_ci_uv.py
      - name: Frozen own editable environment
        working-directory: subject
        timeout-minutes: 11
        run: timeout --signal=TERM --kill-after=10s 640 uv sync --frozen --dev
      - name: Existing libfaketime installation only
        timeout-minutes: 6
        run: |
          timeout --signal=TERM --kill-after=10s 300 bash -euc 'sudo apt-get update -q; sudo apt-get install -y --no-install-recommends faketime'
      - name: Observe the unchanged six-case owner at fixed +45d
        working-directory: subject
        env:
          DIAG_SUBJECT_HEAD: ${{ inputs.subject_head }}
          DIAG_OFFSET: ${{ inputs.offset }}
          DIAG_OBSERVER_DIR: ${{ github.workspace }}/observer/.diagnostic
        run: bash ../observer/.diagnostic/run.sh
      - name: Publish closed diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-clock12-phase-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-clock12-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/published/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
