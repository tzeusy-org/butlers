        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if timeout 120 bash -c 'set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh'; then
              echo "uv installed on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::uv install failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "uv install attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Compute exact environment cache key
        id: environment-key
        run: |
          set -euo pipefail
          cache_key="$(python3 scripts/ci_environment.py key)"
          printf 'key=%s\n' "$cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore advisory environment cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: ${{ steps.environment-key.outputs.key }}

      - name: Install dependencies
        run: python3 scripts/ci_environment.py prepare

      - name: Free disk space before testcontainers
        # Runner disk capacity varies. Preserve the cleanup that eliminated
        # no-space/asyncpg failures on small runners, but do not spend minutes
        # deleting 20+ GiB of tools when the runner already has a safe floor.
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          MIN_FREE_GB=30
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          case "$available_kib" in
            ''|*[!0-9]*)
              echo "::error::could not determine free disk space"
              exit 1
              ;;
          esac
          available_gb=$((available_kib / 1024 / 1024))
          if [ "$available_gb" -lt "$MIN_FREE_GB" ]; then
            echo "Cleaning disk: ${available_gb} GiB is below ${MIN_FREE_GB} GiB."
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/.ghcup
            sudo rm -rf /usr/share/swift
            sudo rm -rf /usr/local/share/boost
            sudo apt-get clean -q
            docker image prune -f --filter "until=1h" || true
          else
            echo "Skipping disk cleanup: ${available_gb} GiB meets ${MIN_FREE_GB} GiB floor."
          fi
          echo "Disk usage after cleanup decision:"
          df -h /

      - name: Download current inventory and computed assignment
        uses: actions/download-artifact@v4
        with:
          name: ci-inventory
          path: ${{ runner.temp }}/ci-inventory

      - name: Compute compatible shard timing key
