    runs-on: ubuntu-latest
    needs: [changes, plan]
    # merge_group: always. pull_request: only when the diff reaches beyond the
    # docs filter (fail-closed, see `changes`) and the affected-test planner
    # (bu-v28ho) did not select a scoped plan -- a scoped plan means
    # check-affected is this shard's evidence instead. push:main: skipped by
    # design, the merge queue already validated this exact tree.
    # `plan` is conditionally skipped (it only runs on a backend-touching
