        run: |
          set -euo pipefail
          timing_key="$(uv run --no-sync python scripts/check_ci_test_shards.py timing-key --lane integration --shard ${{ matrix.shard }} --inventory-dir "${RUNNER_TEMP}/ci-inventory")"
          printf 'key=%s\n' "$timing_key" >> "$GITHUB_OUTPUT"

