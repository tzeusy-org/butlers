name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  session-link-guard:
    # Fast, dependency-free gate (bu-mr5t5): fails the PR when a tool-session
    # link/footer (see scripts/session_link_guard.py) leaks into the PR body
    # or any commit message on the current head. Review-comment coverage is
    # best-effort (falls back to an empty set on any API hiccup) so a GitHub
    # API blip never blocks the mandatory body/commit checks. Advisory like
    # every other check in this workflow: see docs note below on required-check
    # status.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr_body.txt"

      - name: Fetch review comments (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Each call is independently best-effort: a failed/empty response
          # just means that surface contributes nothing, it never fails the
          # step. Raw (non-jq-filtered) JSON is dumped per surface; the combine
          # script below does the field mapping so no shell/jq quoting games
          # are needed here.
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" --paginate \
            > "${RUNNER_TEMP}/rc_review_comments.json" || true
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            > "${RUNNER_TEMP}/rc_issue_comments.json" || true
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
            > "${RUNNER_TEMP}/rc_reviews.json" || true
          python3 scripts/combine_review_comment_sources.py \
            --output "${RUNNER_TEMP}/review_comments.json" \
            --input review-comment "${RUNNER_TEMP}/rc_review_comments.json" \
            --input issue-comment "${RUNNER_TEMP}/rc_issue_comments.json" \
            --input review "${RUNNER_TEMP}/rc_reviews.json"

      - name: Scan for tool-session links
        run: |
          python3 scripts/session_link_guard.py \
            --pr-body-file "${RUNNER_TEMP}/pr_body.txt" \
            --commit-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --review-comments-file "${RUNNER_TEMP}/review_comments.json"

  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Check lock file is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: make lint

      - name: Format check
        run: uv run ruff format --check src/ tests/ roster/ conftest.py -q

      - name: SQL safety check (FOR UPDATE + outer join)
        run: make check-for-update-joins

      - name: Unit tests
        # roster/ is included alongside tests/ so that roster tests explicitly
        # marked `unit` (respected as of bu-10fgt.2 — see roster/conftest.py)
        # run in this fast lane instead of only the Docker integration job.
        #
        # bu-y189y: a command-line -m REPLACES (does not AND with) the
        # addopts `-m 'not nightly and not bench and not perf'` deselection —
        # pytest only honors the last -m it sees. This lane's own filter must
        # therefore restate those exclusions itself, or nightly adapter tests
        # (real creds/binaries) silently get collected in the fast/no-Docker
        # lane.
        run: uv run pytest tests/ roster/ -q --maxfail=1 --tb=short --ignore=tests/e2e -m "not integration and not e2e and not nightly and not bench and not perf" --cov=src/butlers --cov-report=json:coverage.json --cov-report=term-missing

      - name: Smoke tests (fast gate + release evidence)
        id: smoke
        run: |
          mkdir -p .tmp/smoke
          SMOKE_CMD="uv run pytest tests/ --ignore=tests/e2e -m smoke -q --tb=short"

          START_TS=$(date +%s)
          set +e
          $SMOKE_CMD --junit-xml=.tmp/smoke/junit.xml 2>&1 | tee .tmp/smoke/smoke.log
          SMOKE_EXIT=${PIPESTATUS[0]}
          set -e
          END_TS=$(date +%s)
          DURATION_S=$((END_TS - START_TS))
          [ "$SMOKE_EXIT" -eq 0 ] && STATUS=PASS || STATUS=FAIL

          # Write release-evidence JSON and emit a clearly-formatted log line.
          SMOKE_EXIT_VAL=$SMOKE_EXIT \
          SMOKE_SHA="${{ github.sha }}" \
          SMOKE_DURATION=$DURATION_S \
          SMOKE_STATUS=$STATUS \
          SMOKE_CMD_VAL="$SMOKE_CMD" \
          python3 << 'PYEOF'
          import json, os, xml.etree.ElementTree as ET

          sha = os.environ["SMOKE_SHA"]
          duration_s = int(os.environ["SMOKE_DURATION"])
          exit_code = int(os.environ["SMOKE_EXIT_VAL"])
          status = os.environ["SMOKE_STATUS"]
          cmd = os.environ["SMOKE_CMD_VAL"]

          try:
              root = ET.parse(".tmp/smoke/junit.xml").getroot()
              skipped_classes = sorted({
                  tc.get("classname") or tc.get("name", "unknown")
                  for tc in root.findall(".//testcase")
                  if tc.find("skipped") is not None
              })
          except Exception as exc:
              skipped_classes = [f"parse-error:{exc}"]

          evidence = {
              "cmd": cmd,
              "sha": sha,
              "duration_s": duration_s,
              "status": status,
              "exit_code": exit_code,
              "skipped_classes": skipped_classes,
          }
          with open(".tmp/smoke/release-evidence.json", "w") as f:
              json.dump(evidence, f, indent=2)

          print(f"SMOKE-RELEASE-EVIDENCE cmd={cmd!r} sha={sha!r} duration={duration_s}s status={status!r} skipped_classes={skipped_classes!r}")
          print()
          print(json.dumps(evidence, indent=2))
          PYEOF

          exit $SMOKE_EXIT
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload smoke release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-release-evidence
          path: .tmp/smoke/
          retention-days: 30

      - name: Free disk space before testcontainers
        # ubuntu-latest runners arrive with ~14 GB free. Testcontainers pulls
        # pgvector/pgvector:pg17 (~442 MB compressed) and multiple modules spin
        # up independent containers concurrently under -n auto. Removing
        # pre-installed tools that are unused by this job (Android SDK, .NET,
        # Haskell, Swift, large apt caches) reclaims 10-15 GB and eliminates
        # the intermittent "no space left on device" / asyncpg pool timeout
        # failures seen in PRs #2052 and #2055.
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean -q
          docker image prune -f --filter "until=1h" || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Integration test path coverage guard
        run: uv run python3 scripts/check_integration_coverage.py

      - name: Integration tests (testcontainers)
        # Path list intentionally covers the whole test tree (matches pytest's
        # configured `testpaths` in pyproject.toml: tests/ + roster/) rather
        # than enumerating specific subdirectories. An enumerated list rots
        # silently: any new `pytest.mark.integration` test added outside the
        # enumerated dirs would be collected by neither this job nor the "Unit
        # tests" step above (which excludes -m integration) — see bu-m8cmk.
        # The "Integration test path coverage guard" step above independently
        # verifies this path list can never fall behind.
        #
        # bu-y189y: "not bench and not perf" is restated here for the same
        # reason as the "Unit tests" step above — this lane's own -m replaces
        # addopts' deselection rather than ANDing with it, so an
        # integration-marked test that also opts into perf/bench (e.g.
        # tests/migrations/test_audit_log_index_perf.py, which is
        # `pytest.mark.perf` + `pytest.mark.integration`) would otherwise
        # leak into this lane despite its docstring declaring it opt-in only.
        run: uv run pytest tests/ roster/ -q --maxfail=5 --tb=short -m "integration and not nightly and not bench and not perf" -n auto --dist loadfile --cov=src/butlers --cov-append --cov-report=json:coverage.json --cov-report=term-missing
        env:
          # Testcontainers uses the Docker socket directly — no DOCKER_HOST needed on ubuntu-latest
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          # Color thresholds: green ≥80, yellow ≥60, red <60
          if [ "$COVERAGE" -ge 80 ]; then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$COVERAGE" -ge 60 ]; then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: butlers-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.color }}

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Import graph (knip)
        run: npm run knip

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  frontend-e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Build (required for vite preview)
        run: npm run build

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
