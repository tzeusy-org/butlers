            ${{ runner.temp }}/ci-artifacts/affected/junit.xml
            ${{ runner.temp }}/ci-artifacts/affected/top-durations.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  check:
    # Do not allow a green historic check status when a preflight or any shard
    # failed, was skipped for an unexpected reason, or was cancelled. `always()`
    # is deliberate: a skipped historical check can read as green to branch
    # protection after a cancelled prerequisite. Three skips are accepted, and
    # only these three: (a) a pull_request whose `changes` job succeeded and
    # classified the diff as docs-only (`backend == 'false'`); (b) a push to
    # main, where the merge queue's merge_group run already validated this
    # exact tree; and (c) a pull_request where the affected-test planner
    # (bu-v28ho) selected a scoped plan, in which case `check-affected` is
    # required to be the shards' evidence instead. Everything else that is
    # not `success` fails the fan-in. Coverage aggregation and the badge only
    # run when the ten-shard matrix actually ran.
    needs: [changes, plan, check-preflight, check-unit-1, check-unit-2, check-unit-3, check-unit-4, check-unit-5, check-integration-1, check-integration-2, check-integration-3, check-integration-4, check-integration-5, check-affected]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require preflight and every test shard to pass (or be skipped by the path filter)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_BACKEND: ${{ needs.changes.outputs.backend }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          CHECK_PREFLIGHT_RESULT: ${{ needs.check-preflight.result }}
          CHECK_UNIT_1_RESULT: ${{ needs.check-unit-1.result }}
          CHECK_UNIT_2_RESULT: ${{ needs.check-unit-2.result }}
          CHECK_UNIT_3_RESULT: ${{ needs.check-unit-3.result }}
          CHECK_UNIT_4_RESULT: ${{ needs.check-unit-4.result }}
          CHECK_UNIT_5_RESULT: ${{ needs.check-unit-5.result }}
          CHECK_INTEGRATION_1_RESULT: ${{ needs.check-integration-1.result }}
          CHECK_INTEGRATION_2_RESULT: ${{ needs.check-integration-2.result }}
          CHECK_INTEGRATION_3_RESULT: ${{ needs.check-integration-3.result }}
          CHECK_INTEGRATION_4_RESULT: ${{ needs.check-integration-4.result }}
          CHECK_INTEGRATION_5_RESULT: ${{ needs.check-integration-5.result }}
          CHECK_AFFECTED_RESULT: ${{ needs.check-affected.result }}
        run: |
          skip_allowed=0
          skip_reason=""
          require_check_affected=0
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$CHANGES_RESULT" = "success" ] && [ "$CHANGES_BACKEND" = "false" ]; then
            skip_allowed=1
            skip_reason="docs-only pull request: backend shards skipped by the path filter"
          elif [ "$EVENT_NAME" = "push" ]; then
            skip_allowed=1
            skip_reason="push to main: backend shards skipped by design, the merge queue validated this tree"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$CHANGES_BACKEND" = "true" ] && [ "$PLAN_MODE" = "scoped" ]; then
            skip_allowed=1
            require_check_affected=1
            skip_reason="affected-test lane selected a scoped plan: heavy shards skipped, check-affected is the evidence"
          fi

          failed=0
          ran=0
          skipped=0
          for named_result in \
            "check-preflight=$CHECK_PREFLIGHT_RESULT" \
            "check-unit-1=$CHECK_UNIT_1_RESULT" \
            "check-unit-2=$CHECK_UNIT_2_RESULT" \
            "check-unit-3=$CHECK_UNIT_3_RESULT" \
            "check-unit-4=$CHECK_UNIT_4_RESULT" \
            "check-unit-5=$CHECK_UNIT_5_RESULT" \
            "check-integration-1=$CHECK_INTEGRATION_1_RESULT" \
            "check-integration-2=$CHECK_INTEGRATION_2_RESULT" \
            "check-integration-3=$CHECK_INTEGRATION_3_RESULT" \
            "check-integration-4=$CHECK_INTEGRATION_4_RESULT" \
            "check-integration-5=$CHECK_INTEGRATION_5_RESULT"; do
            case "$named_result" in
              *=success) ran=1 ;;
              *=skipped)
                if [ "$skip_allowed" -eq 1 ]; then
                  skipped=1
                else
                  echo "::error::$named_result (skipped, but this event requires the shards to run)"
                  failed=1
                fi
                ;;
              *)
                echo "::error::$named_result"
                failed=1
                ;;
            esac
          done

          if [ "$ran" -eq 1 ] && [ "$skipped" -eq 1 ]; then
            echo "::error::inconsistent shard state: some shards ran and some were skipped"
            failed=1
          fi
          if [ "$ran" -eq 1 ] && [ "$require_check_affected" -eq 1 ]; then
            echo "::error::heavy shards ran but the plan selected a scoped mode; inconsistent state"
            failed=1
          fi

          # check-affected has the inverse requirement: required exactly when
          # the plan selected scoped mode, skipped every other time (docs-only,
          # push:main, merge_group, or a full/escalated plan).
          case "$CHECK_AFFECTED_RESULT" in
            success)
              if [ "$require_check_affected" -ne 1 ]; then
                echo "::error::check-affected=success but this event/plan did not select the scoped lane"
                failed=1
              fi
              ;;
            skipped)
              if [ "$require_check_affected" -eq 1 ]; then
                echo "::error::check-affected=skipped but the plan selected a scoped mode"
                failed=1
              fi
              ;;
            *)
              echo "::error::check-affected=$CHECK_AFFECTED_RESULT"
              failed=1
              ;;
          esac

          if [ "$skipped" -eq 1 ] && [ "$failed" -eq 0 ]; then
            echo "::notice::$skip_reason"
          fi

          if [ "$ran" -eq 1 ] && [ "$failed" -eq 0 ]; then
            echo "shards_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "shards_ran=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$failed"

      - uses: actions/checkout@v6
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}

      - name: Set up Python 3.12
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies for coverage aggregation
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        run: uv sync --frozen --dev

      - name: Download unit shard 1 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-unit-1-coverage-data
          path: ${{ runner.temp }}/ci-coverage/unit-1

      - name: Download unit shard 2 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-unit-2-coverage-data
          path: ${{ runner.temp }}/ci-coverage/unit-2

      - name: Download unit shard 3 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-unit-3-coverage-data
          path: ${{ runner.temp }}/ci-coverage/unit-3

      - name: Download unit shard 4 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-unit-4-coverage-data
          path: ${{ runner.temp }}/ci-coverage/unit-4

      - name: Download unit shard 5 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-unit-5-coverage-data
          path: ${{ runner.temp }}/ci-coverage/unit-5

      - name: Download integration shard 1 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-integration-1-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-1

      - name: Download integration shard 2 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-integration-2-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-2

      - name: Download integration shard 3 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-integration-3-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-3

      - name: Download integration shard 4 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-integration-4-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-4

      - name: Download integration shard 5 coverage data
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-integration-5-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-5

      - name: Combine coverage from all independent test shards
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        id: coverage
        env:
          UNIT_1_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-1/coverage-unit-1.data
          UNIT_2_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-2/coverage-unit-2.data
          UNIT_3_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-3/coverage-unit-3.data
          UNIT_4_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-4/coverage-unit-4.data
          UNIT_5_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-5/coverage-unit-5.data
          INTEGRATION_1_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-1/coverage-integration-1.data
          INTEGRATION_2_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-2/coverage-integration-2.data
          INTEGRATION_3_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-3/coverage-integration-3.data
          INTEGRATION_4_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-4/coverage-integration-4.data
          INTEGRATION_5_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-5/coverage-integration-5.data
          COMBINED_COVERAGE: ${{ runner.temp }}/ci-coverage/coverage-combined.data
          COMBINED_REPORT: ${{ runner.temp }}/ci-artifacts/coverage/coverage.json
        run: |
          mkdir -p "$(dirname "$COMBINED_COVERAGE")" "$(dirname "$COMBINED_REPORT")"
          for coverage_file in \
            $UNIT_1_COVERAGE \
            $UNIT_2_COVERAGE \
            $UNIT_3_COVERAGE \
            $UNIT_4_COVERAGE \
            $UNIT_5_COVERAGE \
            $INTEGRATION_1_COVERAGE \
            $INTEGRATION_2_COVERAGE \
            $INTEGRATION_3_COVERAGE \
            $INTEGRATION_4_COVERAGE \
            $INTEGRATION_5_COVERAGE; do
            test -s "$coverage_file"
          done
          uv run coverage combine --data-file="$COMBINED_COVERAGE" \
            $UNIT_1_COVERAGE \
            $UNIT_2_COVERAGE \
            $UNIT_3_COVERAGE \
            $UNIT_4_COVERAGE \
            $UNIT_5_COVERAGE \
            $INTEGRATION_1_COVERAGE \
            $INTEGRATION_2_COVERAGE \
            $INTEGRATION_3_COVERAGE \
            $INTEGRATION_4_COVERAGE \
            $INTEGRATION_5_COVERAGE
          uv run coverage json --data-file="$COMBINED_COVERAGE" -o "$COMBINED_REPORT"
          uv run coverage report --data-file="$COMBINED_COVERAGE" --show-missing
          export COMBINED_REPORT
          COVERAGE=$(python3 -c 'import json, os; print(round(json.load(open(os.environ["COMBINED_REPORT"]))["totals"]["percent_covered"]))')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          # Color thresholds: green >=80, yellow >=60, red <60.
          if [ "$COVERAGE" -ge 80 ]; then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$COVERAGE" -ge 60 ]; then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload combined coverage report
        if: ${{ steps.gate.outputs.shards_ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-combined-coverage-report
          path: ${{ runner.temp }}/ci-artifacts/coverage/coverage.json
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Update coverage badge
        # Shards no longer run on push:main, so the merge queue's merge_group run
        # is the lane that still has coverage data for the tree about to land.
        # merge_group runs execute in the repository context and see repository
        # secrets; dynamic-badges-action needs only the gist secrets, not the ref.
        if: ${{ steps.gate.outputs.shards_ran == 'true' && github.event_name == 'merge_group' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: butlers-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.color }}

  frontend:
    runs-on: ubuntu-latest
    needs: [changes]
    # merge_group and push:main: always (cheap, no coverage dependency).
    # pull_request: only when frontend/ changed (fail-closed, see `changes`).
    if: github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true')

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Em-dash copy gate (bu-370uj)
        run: npm run lint:emdash

      - name: Query-result coercion gate (bu-ep4ks.5)
        run: npm run lint:query-coercion

      - name: Import graph (knip)
        run: npm run knip

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    # merge_group and push:main: always (cheap, no coverage dependency).
    # pull_request: only when frontend/ changed (fail-closed, see `changes`).
    if: github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true')

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Build (required for vite preview)
        run: npm run build

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
