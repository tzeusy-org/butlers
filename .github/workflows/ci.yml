          path: |
            ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.shard }}/junit.xml
            ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.shard }}/top-durations.txt
            ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.shard }}/shard-observation.json
            ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.shard }}/runner-observation.json
          retention-days: 14
