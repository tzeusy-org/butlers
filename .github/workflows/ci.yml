        env:
          COVERAGE_FILE: ${{ runner.temp }}/ci-coverage/coverage-integration-${{ matrix.shard }}.data
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.shard }}
          CI_SHARD_TIMINGS: ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.shard }}/shard-observation.json
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run python scripts/check_ci_test_shards.py run --lane integration --shard ${{ matrix.shard }} --inventory-dir "${RUNNER_TEMP}/ci-inventory"

