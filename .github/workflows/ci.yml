  check-affected:
    timeout-minutes: 82
    outputs:
      verified: ${{ steps.selected-execution.outputs.verified }}
    # Affected-test lane (bu-v28ho): the route job's evidence when it
    # selected a scoped plan. Runs the planner-selected test paths directly
    # instead of the full eleven-child matrix. Not part of the coverage-combine
    # pipeline in `coverage` -- this lane trades combined coverage for wall
    # time on the PRs where the planner's selection is precise, and the
    # merge queue's merge_group run still exercises every shard with
    # coverage before anything lands on main.
    runs-on: ubuntu-latest
    needs: [route, guards]
    # Explicit route/guard prerequisites keep the conditional affected lane
    # from becoming a substitute for a failed classifier or static gate.
    if: always() && needs.route.result == 'success' && github.event_name == 'pull_request' && needs.route.outputs.mode == 'scoped'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.15"

      - name: Install uv
        run: |
          set -euo pipefail
