name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue (bu-r5mnn) runs this workflow against the exact tree it
  # is about to land; that run is the terminal broad gate. The concurrency
  # group below already keys on github.ref, which is unique per queue entry.
  merge_group:

env:
  # Setup actions and uv/cache repair share the same full interpreter identity.
  UV_PYTHON: "3.12.15"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    timeout-minutes: 2
    # Stdlib-only routing cannot establish testcase membership. Uncertainty widens.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      mode: ${{ steps.classify.outputs.mode }}
      test_paths: ${{ steps.classify.outputs.test_paths }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            docs:
              - 'about/**'
              - 'openspec/**'
              - 'docs/**'
              - '*.md'
              - '.beads/**'
              - 'LICENSE'
            all:
              - '**'

      - name: Classify and conservatively plan with stdlib only
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ALL_FILES: ${{ steps.filter.outputs.all_files }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_route.py

  go-bridge:
    # New lane: source-derived bound, not measured healthy/p95 calibration.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [route]
    if: needs.route.outputs.backend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: whatsapp-bridge
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go 1.25.11
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.11'
          check-latest: false
          cache: true
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Test the Go bridge
        run: timeout --signal=TERM --kill-after=30s 10m go test -mod=readonly -count=1 -timeout=5m ./...
      - name: Verify Go lockfiles are unchanged
        run: git diff --exit-code -- go.mod go.sum

  guards:
    timeout-minutes: 35
    # Every mandatory static gate in one job: one checkout, one Python, one
    # Node and frozen dev environment. The moved UV/Ruff/SQL checks retain
    # their exact scopes; preflight owns the lane totals, test budget and smoke.
    # The nine former guard jobs each paid their own runner spin-up
    # and checkout to run a script that takes seconds. Each guard step keeps
    # the comment block that explains why it exists; those comments are
    # load-bearing repo knowledge. Steps run under `!cancelled()` so one failing
    # guard never hides the findings of the others; the last step fails the job
    # if any guard step failed. Runs on every event. The active
    # `main-merge-queue` ruleset requires `guards` alongside `check` and
    # `frontend` on the exact `merge_group` tree; unlike path-filtered
    # `frontend`, this job never skips.
    runs-on: ubuntu-latest
    needs: [route]
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up the CI Python environment
        uses: ./.github/actions/ci-python-environment

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"

      - name: Install OpenSpec 1.9.0
        run: npm install --global @fission-ai/openspec@1.9.0

      - name: Check lock file is up to date
        id: lock
        if: ${{ !cancelled() }}
        run: uv lock --check

      - name: Cache pinned lint tools
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .tmp/lint-tools
          key: lint-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lint-tool-versions.json') }}

      - name: Install lint tools
        run: make install-lint-tools

      - name: Prepare trusted Pyright source
        run: make prepare-typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: make lint

      - name: Format check
        id: format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src/ tests/ roster/ conftest.py -q

      - name: SQL safety check (FOR UPDATE + outer join)
        id: sql_safety
        if: ${{ !cancelled() }}
        run: make check-for-update-joins

      # Session-link guard (bu-mr5t5): fails the PR when a tool-session
      # link/footer (see scripts/session_link_guard.py) leaks into the PR title,
      # body, review comments, or non-trailer commit text on the current head.
      # Review-comment coverage is best-effort (falls back to an empty set on
      # any API hiccup) so a GitHub API blip never blocks the mandatory
      # title/body/commit checks. PR-only: the inputs do not exist on other events.
      - name: Write PR title and body to files
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fetch-point admission: reruns see actual current metadata, while
          # the commit range below remains bound to this event's source head.
          # 97s retry budget; nominal 100s TERM + 3s KILL command envelope.
          # The step shell stays outside the helper's supervised process group.
          if timeout --signal=TERM --kill-after=3s 100s \
            python3 scripts/fetch_pr_metadata.py \
              --number "$PR_NUMBER" --output-dir "$RUNNER_TEMP" 2>/dev/null; then
            :
          else
            status=$?
            rm -f -- "$RUNNER_TEMP/pr_title.txt" "$RUNNER_TEMP/pr_body.txt" \
              "$RUNNER_TEMP/pr_metadata_receipt.json" 2>/dev/null || true
            echo 'pr_metadata: unavailable_or_invalid'
            exit "$status"
          fi

      - name: Fetch review comments (best-effort)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Each call is independently best-effort: a failed/empty response
          # just means that surface contributes nothing, it never fails the
          # step. Raw (non-jq-filtered) JSON is dumped per surface; the combine
          # script below does the field mapping so no shell/jq quoting games
          # are needed here.
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" --paginate \
            > "${RUNNER_TEMP}/rc_review_comments.json" 2>/dev/null || true
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            > "${RUNNER_TEMP}/rc_issue_comments.json" 2>/dev/null || true
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
            > "${RUNNER_TEMP}/rc_reviews.json" 2>/dev/null || true
          python3 scripts/combine_review_comment_sources.py \
            --output "${RUNNER_TEMP}/review_comments.json" \
            --input review-comment "${RUNNER_TEMP}/rc_review_comments.json" \
            --input issue-comment "${RUNNER_TEMP}/rc_issue_comments.json" \
            --input review "${RUNNER_TEMP}/rc_reviews.json"

      - name: Scan for tool-session links
        id: session_links
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: |
          python3 scripts/session_link_guard.py --redact-findings \
            --pr-title-file "${RUNNER_TEMP}/pr_title.txt" \
            --pr-body-file "${RUNNER_TEMP}/pr_body.txt" \
            --commit-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --review-comments-file "${RUNNER_TEMP}/review_comments.json"

      # Em-dash guard (bu-370uj): enforces non-negotiable #6 ("no em-dashes in
      # doctrine or dashboard copy") over the doctrine markdown corpus (about/
      # essays + roster/*/MANIFESTO.md + roster/*/AGENTS.md). A per-file
      # baseline (scripts/em-dash-baseline.json) freezes pre-existing debt so
      # the gate lands green today while blocking any net-new em-dash and any
      # new dirty file. Frontend user-facing copy is enforced by the eslint
      # rule in the `frontend` job instead.
      - name: Check for em-dashes in doctrine + dashboard copy
        id: em_dashes
        if: ${{ !cancelled() }}
        run: python3 scripts/check-no-em-dashes.py

      # Spec-overwrite guard (bu-s9uv3): `openspec archive` writes the WHOLE
      # requirement block from a change into openspec/specs/, so an unarchived
      # `## MODIFIED Requirements` block authored against an older ancestor
      # silently deletes whatever the baseline gained in between. OpenSpec 1.9.0
      # guards only scenario NAMES, so a block that keeps every name and rewrites
      # the bodies validates clean and still destroys baseline content -- which has
      # happened three times on the same axis. This compares bodies. A digest-keyed
      # ratchet (scripts/spec-overwrite-baseline.json) freezes today's debt and
      # re-fires as soon as an archive moves a requirement under an unarchived
      # block.
      - name: Check unarchived MODIFIED spec blocks against the live baseline
        id: spec_overwrites
        if: ${{ !cancelled() }}
        run: python3 scripts/check_spec_overwrites.py

      # bu-xjs98p.1: new and edited requirements in active changes carry identity. Every
      # ADDED/MODIFIED block needs ID, Source and Scope lines unless it is frozen in the
      # content-addressed baseline (scripts/requirement-trace-baseline.json); editing a frozen
      # block makes it carry the lines. Source scan only; no CLI needed.
      - name: Check ADDED/MODIFIED requirements carry ID, Source and Scope lines
        id: requirement_trace
        if: ${{ !cancelled() }}
        run: python3 scripts/check_requirement_trace_lines.py

      # Strict OpenSpec validation gate for bu-n58sv. The repository carries
      # both canonical specs and active deltas; validating both prevents
      # RFC-2119/prose and scenario-loss debt from accumulating behind scoped
      # per-change checks. The CLI version is pinned above so local and hosted
      # results use the same parser and strictness rules.
      - name: Validate all OpenSpec artifacts in strict mode
        id: openspec_strict
        if: ${{ !cancelled() }}
        run: make check-openspec-strict

      # Archived-requirements guard (bu-966by): the other side of the ledger from
      # the spec-overwrite guard. Archiving a change is supposed to write its
      # requirements into openspec/specs/, and 488 of them across 44 changes never
      # got there while every check stayed green -- `openspec validate` reads delta
      # syntax, `openspec archive` reports what it wrote and not what it skipped,
      # and check_spec_overwrites.py never looks at the baseline side at all. This
      # asserts each archived `## ADDED` requirement exists in the baseline by name
      # and each `## MODIFIED` block's content reached it, failing per requirement
      # so a half-applied archive cannot look green. A digest-keyed ratchet
      # (scripts/archived-requirements-baseline.json) freezes today's debt for
      # bu-tk618 to burn down by hand; there is no re-freeze flag on purpose,
      # and a `## REMOVED` block excuses an absence only once its own change
      # has archived, so a pending proposal cannot mute a gap off-ratchet.
      - name: Check archived change requirements reached the baseline
        id: archived_requirements
        if: ${{ !cancelled() }}
        run: python3 scripts/check_archived_requirements_landed.py

      # Owner-email guard: the repo stays user-agnostic, so no tracked file may
      # carry the owner's personal addresses (matched by local-part hash).
      - name: Check no owner email addresses are tracked
        if: ${{ !cancelled() }}
        run: python3 scripts/check_owner_emails.py

      # Countable-tasks guard (bu-h7igs): `openspec archive`'s incomplete-task
      # gate counts markdown checkbox lines only. A tasks.md written as `### N.`
      # sections with per-task acceptance bullets -- richer than most checkbox files
      # here, not lazier -- matches zero of them, so archive reports
      # `Task status: No tasks`, cannot be incomplete, and archives unprompted. The
      # defect is not the missing warning but that the gate's silence is
      # indistinguishable from its pass: "archived with no task warning" reads as
      # evidence the tasks were done. This fails on any unarchived change the gate
      # cannot see, so the difference is restored before the change reaches archive.
      - name: Check every change's tasks.md is countable by the archive gate
        id: countable_tasks
        if: ${{ !cancelled() }}
        run: python3 scripts/check_countable_tasks.py

      # Cited-requirements guard (bu-lpwjc): the third side of the ledger. The
      # two guards above read the spec tree against itself and have never opened a
      # test file, so nothing ever checked that a REQ id cited by a test docstring
      # resolves to a definition at all. Measured at introduction: 39 distinct ids
      # are cited, 30 resolve only to a change that has not archived yet, and
      # REQ-cli-runtime-auth-003 resolves nowhere -- there is no cli-runtime-auth
      # capability in the repo. openspec/specs/ and unarchived changes are the two
      # definition sources; openspec/changes/archive/** deliberately is NOT one,
      # because an archived change has already had its chance to write the
      # requirement into the baseline. Counting it would make this blind to
      # exactly the case it exists for (`openspec archive --skip-specs` moves the
      # delta and writes no baseline) and would hide a half-applied archive, since
      # the ids that landed and the ids that did not would read the same.
      # Pending-only citations pass but are printed with the change they lean on:
      # that is the state that rots. A ratchet
      # (scripts/cited-requirements-baseline.json) freezes today's one dangling
      # citation per (test file, id); there is no re-freeze flag on purpose.
      - name: Check REQ ids cited by tests resolve to a definition
        id: cited_requirements
        if: ${{ !cancelled() }}
        run: python3 scripts/check_cited_requirements_resolve.py

      # Duplicate-name guard (bu-ayrbg): two branches each added a
      # module-level `_fenced_code_blocks` to one test file with incompatible
      # return types. The definitions were far apart, git auto-merged them, and
      # the later one silently shadowed the earlier one for every caller --
      # including a security guard that then iterated the characters of a string
      # and returned [] for every input, so a runnable pg_restore.sh in a fenced
      # block would have passed REQ-database-security-006 unnoticed.
      #
      # The non-obvious part is that `ruff check` is green on that tree. F811
      # (redefinition of unused name) does not fire when the FIRST definition is
      # USED between the two definitions -- the name is not "unused" at the point
      # of redefinition. That intervening-use condition is F811's blind spot, and
      # it is exactly what a merge produces, since each branch defines the name
      # and uses it. Per-PR CI cannot see it either: both PRs are green alone and
      # CI never builds the union of open PRs.
      #
      # This asserts each module-level name is bound once per file, independent of
      # use. It scans the lint gate's own scope (src/, tests/, roster/,
      # conftest.py) and fails if it finds zero Python files, so it cannot go
      # quiet the way the shadowed guard did. Ratchet:
      # scripts/duplicate-toplevel-names-baseline.json, shipped empty, with no
      # re-freeze flag on purpose.
      - name: Check for duplicate module-level names
        id: duplicate_names
        if: ${{ !cancelled() }}
        run: python3 scripts/check_duplicate_toplevel_names.py

      - name: Fail if any guard failed
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GUARD_OUTCOMES: |
            lock=${{ steps.lock.outcome }}
            lint=${{ steps.lint.outcome }}
            format=${{ steps.format.outcome }}
            sql_safety=${{ steps.sql_safety.outcome }}
            session_links=${{ steps.session_links.outcome }}
            em_dashes=${{ steps.em_dashes.outcome }}
            spec_overwrites=${{ steps.spec_overwrites.outcome }}
            requirement_trace=${{ steps.requirement_trace.outcome }}
            openspec_strict=${{ steps.openspec_strict.outcome }}
            archived_requirements=${{ steps.archived_requirements.outcome }}
            countable_tasks=${{ steps.countable_tasks.outcome }}
            cited_requirements=${{ steps.cited_requirements.outcome }}
            duplicate_names=${{ steps.duplicate_names.outcome }}
        run: |
          failed=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              *=success) ;;
              session_links=skipped)
                if [ "$EVENT_NAME" = "pull_request" ]; then
                  echo "::error::PR session-link guard skipped"
                  failed=1
                fi
                ;;
              *)
                echo "::error::guard failed: $line"
                failed=1
                ;;
            esac
          done <<< "$GUARD_OUTCOMES"
          exit "$failed"

      - name: Set up Node 24
        if: needs.route.outputs.backend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Install dependencies
        if: needs.route.outputs.backend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Native API schema drift
        if: needs.route.outputs.backend == 'true'
        working-directory: frontend
        run: npm run check:api

      - name: Native client path and query contracts
        if: needs.route.outputs.backend == 'true'
        working-directory: frontend
        run: npm run check:api-contract


      - name: Lint
        if: needs.route.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint


      - name: Em-dash copy gate (bu-370uj)
        if: needs.route.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint:emdash


      - name: Query-result coercion gate (bu-ep4ks.5)
        if: needs.route.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint:query-coercion


      - name: Import graph (knip)
        if: needs.route.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run knip


      - name: Build
        if: needs.route.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build




  check-preflight:
    timeout-minutes: 27
    runs-on: ubuntu-latest
    needs: [route, guards, check-unit, check-integration]
    # merge_group: always. pull_request: only when the diff reaches beyond the
    # docs filter (fail-closed, see `changes`). push:main: skipped by design,
    # the merge queue already validated this exact tree.
    if: always() && needs.guards.result == 'success' && (needs.route.outputs.mode == 'full' || needs.route.outputs.mode == 'scoped')

    steps:
      - uses: actions/checkout@v6

      - name: Set up the CI Python environment
        uses: ./.github/actions/ci-python-environment

      - name: Download every lane group's evidence
        if: needs.route.outputs.mode == 'full'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-*-test-evidence
          path: ${{ runner.temp }}/ci-test-receipts

      - name: Check the lane groups add up and stay within the test budget
        # No group may drop or duplicate a test: each lane's group counts must sum
        # to one fresh --collect-only count of the same selection (bu-29wkwj.2).
        if: needs.route.outputs.mode == 'full'
        run: uv run --no-sync python scripts/ci_lanes.py totals --counts "${RUNNER_TEMP}/ci-test-receipts"

      - name: Smoke tests (fast gate + release evidence)
        id: smoke
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/smoke
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          mkdir -p "$SMOKE_EVIDENCE_DIR"
          SMOKE_CMD="uv run pytest tests/ --ignore=tests/e2e -m smoke -q --tb=short"

          START_TS=$(date +%s)
          set +e
          $SMOKE_CMD --junit-xml="$SMOKE_EVIDENCE_DIR/raw-junit.xml" 2>&1 | tee "$SMOKE_EVIDENCE_DIR/smoke.log"
          SMOKE_EXIT=${PIPESTATUS[0]}
          set -e
          END_TS=$(date +%s)
          DURATION_S=$((END_TS - START_TS))
          [ "$SMOKE_EXIT" -eq 0 ] && STATUS=PASS || STATUS=FAIL

          # Write release-evidence JSON and emit a clearly-formatted log line.
          SMOKE_EXIT_VAL=$SMOKE_EXIT \
          SMOKE_SHA="${{ github.sha }}" \
          SMOKE_DURATION=$DURATION_S \
          SMOKE_STATUS=$STATUS \
          SMOKE_CMD_VAL="$SMOKE_CMD" \
          SMOKE_EVIDENCE_DIR="$SMOKE_EVIDENCE_DIR" \
          python3 << 'PYEOF'
          import json, os, sys, xml.etree.ElementTree as ET

          sha = os.environ["SMOKE_SHA"]
          duration_s = int(os.environ["SMOKE_DURATION"])
          exit_code = int(os.environ["SMOKE_EXIT_VAL"])
          status = os.environ["SMOKE_STATUS"]
          cmd = os.environ["SMOKE_CMD_VAL"]
          evidence_dir = os.environ["SMOKE_EVIDENCE_DIR"]

          try:
              root = ET.parse(os.path.join(evidence_dir, "raw-junit.xml")).getroot()
              skipped_classes = sorted({
                  tc.get("classname") or tc.get("name", "unknown")
                  for tc in root.findall(".//testcase")
                  if tc.find("skipped") is not None
              })
          except (ET.ParseError, OSError) as exc:
              print(exc, file=sys.stderr)
              skipped_classes = ["unavailable"]

          evidence = {
              "cmd": cmd,
              "sha": sha,
              "duration_s": duration_s,
              "status": status,
              "exit_code": exit_code,
              "skipped_classes": skipped_classes,
          }
          with open(os.path.join(evidence_dir, "release-evidence.json"), "w") as f:
              json.dump(evidence, f, indent=2)

          print(f"SMOKE-RELEASE-EVIDENCE cmd={cmd!r} sha={sha!r} duration={duration_s}s status={status!r} skipped_classes={skipped_classes!r}")
          print()
          print(json.dumps(evidence, indent=2))
          PYEOF

          exit "$SMOKE_EXIT"

      - name: Prepare smoke test duration evidence
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        run: |
          python3 scripts/summarize_junit_durations.py \
            --input "${RUNNER_TEMP}/ci-artifacts/smoke/raw-junit.xml" \
            --sanitized-junit "${RUNNER_TEMP}/ci-artifacts/smoke/junit.xml" \
            --durations-output "${RUNNER_TEMP}/ci-artifacts/smoke/top-durations.txt" \
            --limit 25

      - name: Upload smoke release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-release-evidence
          path: ${{ runner.temp }}/ci-artifacts/smoke/release-evidence.json
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Upload smoke test evidence
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-test-evidence
          path: |
            ${{ runner.temp }}/ci-artifacts/smoke/junit.xml
            ${{ runner.temp }}/ci-artifacts/smoke/top-durations.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  check-unit:
    timeout-minutes: 28
    runs-on: ubuntu-latest
    needs: [route]
    # pytest-split duration-balanced groups over the committed .test_durations.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    if: needs.route.outputs.mode == 'full'

    env:
      CI_COVERAGE: '0'

    steps:
      - uses: actions/checkout@v6

      - name: Set up the CI Python environment
        uses: ./.github/actions/ci-python-environment

      - name: Unit tests (group ${{ matrix.group }})
        env:
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.group }}
        run: uv run python scripts/ci_lanes.py run --lane unit --group ${{ matrix.group }} --output "${RUNNER_TEMP}/ci-artifacts/unit-${{ matrix.group }}"

      - name: Prepare unit group ${{ matrix.group }} duration evidence
        if: always()
        run: |
          python3 scripts/summarize_junit_durations.py \
            --input "${RUNNER_TEMP}/ci-artifacts/unit-${{ matrix.group }}/raw-junit.xml" \
            --sanitized-junit "${RUNNER_TEMP}/ci-artifacts/unit-${{ matrix.group }}/junit.xml" \
            --durations-output "${RUNNER_TEMP}/ci-artifacts/unit-${{ matrix.group }}/top-durations.txt" \
            --limit 25

      - name: Upload unit group ${{ matrix.group }} test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-${{ matrix.group }}-test-evidence
          path: |
            ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.group }}/junit.xml
            ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.group }}/top-durations.txt
            ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.group }}/collected.json
            ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.group }}/condensation-refusal-*.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  check-integration:
    timeout-minutes: 36
    runs-on: ubuntu-latest
    needs: [route]
    # pytest-split duration-balanced groups over the committed .test_durations.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    if: needs.route.outputs.mode == 'full'

    env:
      CI_COVERAGE: '0'

    steps:
      - uses: actions/checkout@v6

      - name: Set up the CI Python environment
        uses: ./.github/actions/ci-python-environment

      - name: Free disk space before testcontainers
        # Runner disk capacity varies. Preserve the cleanup that eliminated
        # no-space/asyncpg failures on small runners, but do not spend minutes
        # deleting 20+ GiB of tools when the runner already has a safe floor.
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          MIN_FREE_GB=30
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          case "$available_kib" in
            ''|*[!0-9]*)
              echo "::error::could not determine free disk space"
              exit 1
              ;;
          esac
          available_gb=$((available_kib / 1024 / 1024))
          if [ "$available_gb" -lt "$MIN_FREE_GB" ]; then
            echo "Cleaning disk: ${available_gb} GiB is below ${MIN_FREE_GB} GiB."
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/.ghcup
            sudo rm -rf /usr/share/swift
            sudo rm -rf /usr/local/share/boost
            sudo apt-get clean -q
            docker image prune -f --filter "until=1h" || true
          else
            echo "Skipping disk cleanup: ${available_gb} GiB meets ${MIN_FREE_GB} GiB floor."
          fi
          echo "Disk usage after cleanup decision:"
          df -h /

      - name: Integration tests (group ${{ matrix.group }})
        env:
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.group }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run python scripts/ci_lanes.py run --lane integration --group ${{ matrix.group }} --output "${RUNNER_TEMP}/ci-artifacts/integration-${{ matrix.group }}"

      - name: Prepare integration group ${{ matrix.group }} duration evidence
        if: always()
        run: |
          python3 scripts/summarize_junit_durations.py \
            --input "${RUNNER_TEMP}/ci-artifacts/integration-${{ matrix.group }}/raw-junit.xml" \
            --sanitized-junit "${RUNNER_TEMP}/ci-artifacts/integration-${{ matrix.group }}/junit.xml" \
            --durations-output "${RUNNER_TEMP}/ci-artifacts/integration-${{ matrix.group }}/top-durations.txt" \
            --limit 25

      - name: Upload integration group ${{ matrix.group }} test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-integration-${{ matrix.group }}-test-evidence
          path: |
            ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.group }}/junit.xml
            ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.group }}/top-durations.txt
            ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.group }}/collected.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  check-affected:
    timeout-minutes: 82
    outputs:
      verified: ${{ steps.selected-execution.outputs.verified }}
    # Affected-test lane (bu-v28ho): the route job's evidence when it
    # selected a scoped plan. Runs the planner-selected test paths directly
    # instead of the full eleven-child matrix. The merge queue still exercises
    # every shard before main; owned daily/manual coverage assurance separately
    # instruments the same complete populations.
    runs-on: ubuntu-latest
    needs: [route]
    # Explicit route admission bounds the scoped lane; the required final
    # verdict still refuses a failed classifier or static guard.
    if: always() && needs.route.result == 'success' && github.event_name == 'pull_request' && needs.route.outputs.mode == 'scoped'

    steps:
      - uses: actions/checkout@v6

      - name: Set up the CI Python environment
        uses: ./.github/actions/ci-python-environment

      - name: Affected tests (scoped plan)
        id: selected-execution
        env:
          TEST_PATHS_JSON: ${{ needs.route.outputs.test_paths }}
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/affected
          # Keep the same real integration/testcontainers runner and defaults.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          uv run --no-sync python scripts/ci_affected.py --output "$TEST_EVIDENCE_DIR"

      - name: Prepare affected-test duration evidence
        if: always()
        run: |
          python3 scripts/summarize_junit_durations.py \
            --input "${RUNNER_TEMP}/ci-artifacts/affected/raw-junit.xml" \
            --sanitized-junit "${RUNNER_TEMP}/ci-artifacts/affected/junit.xml" \
            --durations-output "${RUNNER_TEMP}/ci-artifacts/affected/top-durations.txt" \
            --limit 25

      - name: Upload affected-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-affected-test-evidence
          path: |
            ${{ runner.temp }}/ci-artifacts/affected/junit.xml
            ${{ runner.temp }}/ci-artifacts/affected/top-durations.txt
            ${{ runner.temp }}/ci-artifacts/affected/selected-reference.json
            ${{ runner.temp }}/ci-artifacts/affected/selected-execution.json
            ${{ runner.temp }}/ci-artifacts/affected/selected-proof.json
            ${{ runner.temp }}/ci-artifacts/affected/condensation-refusal-*.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  check:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    needs: [route, guards, check-preflight, check-unit, check-integration, check-affected, frontend-e2e, go-bridge]
    if: always()
    steps:
      - name: Fail closed from prerequisite verdicts only
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import PurePosixPath
          def admitted_paths(paths: object) -> bool:
              """Checkout-free selected-file admission, mirrored by the required verdict."""
              return (
                  isinstance(paths, list)
                  and bool(paths)
                  and all(isinstance(path, str) for path in paths)
                  and len(paths) == len(set(paths))
                  and all(
                      PurePosixPath(path).as_posix() == path
                      and not any(part in {".", ".."} for part in path.split("/"))
                      and "\\" not in path
                      and "::" not in path
                      and path.endswith(".py")
                      and path.startswith(("tests/", "roster/"))
                      and not path.startswith("tests/e2e/")
                      and not any(ord(character) < 32 for character in path)
                      for path in paths
                  )
              )

          def verdict(*, needs: dict, event: str, ref: str) -> bool:
              """Only verdicts; unknown jobs/skips/results and malformed outputs fail closed."""
              expected = {
                  "route",
                  "guards",
                  "check-preflight",
                  "check-unit",
                  "check-integration",
                  "check-affected",
                  "frontend-e2e",
                  "go-bridge",
              }
              if not isinstance(needs, dict) or not expected <= needs.keys():
                  return False
              if any(
                  not isinstance(value, dict)
                  or value.get("result") not in {"success", "skipped"}
                  or not isinstance(value.get("outputs"), dict)
                  or any(not isinstance(item, str) for item in value["outputs"].values())
                  for value in needs.values()
              ):
                  return False
              if needs["route"]["result"] != "success" or needs["guards"]["result"] != "success":
                  return False
              outputs = needs["route"]["outputs"]
              if outputs.get("backend") not in {"true", "false"} or outputs.get("frontend") not in {
                  "true",
                  "false",
              }:
                  return False
              mode = outputs.get("mode")
              if event == "merge_group":
                  if mode != "full" or outputs["backend"] != "true" or outputs["frontend"] != "true":
                      return False
              elif event == "push" and ref == "refs/heads/main":
                  if mode != "push" or outputs["backend"] != "true" or outputs["frontend"] != "true":
                      return False
              elif event == "pull_request":
                  if mode not in {"docs", "scoped", "full"} or (mode == "docs") != (
                      outputs["backend"] == "false"
                  ):
                      return False
              else:
                  return False
              try:
                  paths = json.loads(outputs["test_paths"])
              except (KeyError, ValueError):
                  return False
              if not isinstance(paths, list) or any(
                  not isinstance(path, str)
                  or not path.startswith(("tests/", "roster/"))
                  or any(part in {".", ".."} for part in path.split("/"))
                  or any(ord(character) < 32 for character in path)
                  for path in paths
              ):
                  return False
              if bool(paths) != (mode == "scoped"):
                  return False
              if mode == "scoped" and (
                  not admitted_paths(paths)
                  or needs["check-affected"]["outputs"].get("verified") != "true"
              ):
                  return False
              results = {
                  "route": "success",
                  "guards": "success",
                  "check-preflight": "success" if mode in {"full", "scoped"} else "skipped",
                  "check-affected": "success" if mode == "scoped" else "skipped",
                  "check-unit": "success" if mode == "full" else "skipped",
                  "check-integration": "success" if mode == "full" else "skipped",
                  # Playwright e2e is required wherever it runs: every merge group
                  # and main push, and pull requests the route marks as frontend changes.
                  "frontend-e2e": "success" if outputs["frontend"] == "true" else "skipped",
                  "go-bridge": "success" if outputs["backend"] == "true" else "skipped",
              }
              return all(job["result"] == results.get(name, "success") for name, job in needs.items())
          needs = json.loads(os.environ['NEEDS_JSON'])
          passed = verdict(needs=needs, event=os.environ['EVENT_NAME'], ref=os.environ['REF'])
          if passed:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write(f"shards_ran={str(needs['route']['outputs']['mode'] == 'full').lower()}\n")
          raise SystemExit(0 if passed else 1)
          PY

  frontend-vitest:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    needs: [route]
    if: needs.route.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked frontend environment
        working-directory: frontend
        run: npm ci
      - name: Run the exact locked Vitest partition with source-bound evidence
        run: python3 scripts/ci_vitest.py --shard ${{ matrix.shard }} --output "${RUNNER_TEMP}/vitest-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-vitest-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-${{ matrix.shard }}/receipt.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  frontend:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    needs: [route, guards, frontend-vitest]
    if: always()
    steps:
      - name: Required frontend verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          valid = set(needs) == {'route', 'guards', 'frontend-vitest'}
          valid = valid and all(isinstance(v, dict) and v.get('result') in {'success', 'skipped'} for v in needs.values())
          valid = valid and needs['route']['result'] == needs['guards']['result'] == 'success'
          applicable = needs.get('route', {}).get('outputs', {}).get('frontend')
          valid = valid and applicable in {'true', 'false'}
          valid = valid and needs['frontend-vitest']['result'] == ('success' if applicable == 'true' else 'skipped')
          raise SystemExit(0 if valid else 1)
          PY
      - uses: actions/checkout@v6
        if: needs.route.outputs.frontend == 'true'
      - name: Download actual Vitest child one
        if: needs.route.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-vitest-1
          path: ${{ runner.temp }}/vitest-1
      - name: Download actual Vitest child two
        if: needs.route.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-vitest-2
          path: ${{ runner.temp }}/vitest-2
      - name: Independently reconcile both current Vitest populations
        if: needs.route.outputs.frontend == 'true'
        run: python3 scripts/ci_vitest.py --reconcile "${RUNNER_TEMP}/vitest-1/receipt.json" "${RUNNER_TEMP}/vitest-2/receipt.json"

  frontend-e2e:
    # Provisional: ceil((2*228s before envelope + 720s installer reserve)/60).
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Builds its own bundle so the browser lane starts beside guards instead
    # of waiting for it (bu-29wkwj.2).
    needs: [route]
    # Required through the `check` verdict (owner decision bu-w72da2 = A):
    # merge_group and push:main always run it; pull_request runs it only when the
    # route classifies the PR as frontend: frontend/, .github/workflows/, scripts/ci_
    # or scripts/check_ci_ changed, or the diff is undeterminable (fail-closed, see
    # `route`). Every other PR requires the explicit skip.
    if: github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.route.outputs.frontend == 'true')

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve locked Playwright version
        id: playwright-version
        run: |
          version="$(npm run --silent test:e2e:cache-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Cache is advisory. A failed restore still reaches the mandatory bounded
      # installer, OS dependencies and locked-browser launch verification.
      - name: Cache locked Playwright browsers
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Build
        run: npm run build

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
