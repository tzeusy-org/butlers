    if: always() && needs.changes.result == 'success' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' && needs.plan.outputs.mode != 'scoped'))

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Free disk space before testcontainers
        # Runner disk capacity varies. Preserve the cleanup that eliminated
        # no-space/asyncpg failures on small runners, but do not spend minutes
        # deleting 20+ GiB of tools when the runner already has a safe floor.
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          MIN_FREE_GB=30
          available_kib=$(df -Pk / | awk 'NR == 2 {print $4}')
          case "$available_kib" in
            ''|*[!0-9]*)
              echo "::error::could not determine free disk space"
              exit 1
              ;;
          esac
          available_gb=$((available_kib / 1024 / 1024))
          if [ "$available_gb" -lt "$MIN_FREE_GB" ]; then
            echo "Cleaning disk: ${available_gb} GiB is below ${MIN_FREE_GB} GiB."
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/.ghcup
            sudo rm -rf /usr/share/swift
            sudo rm -rf /usr/local/share/boost
            sudo apt-get clean -q
            docker image prune -f --filter "until=1h" || true
          else
            echo "Skipping disk cleanup: ${available_gb} GiB meets ${MIN_FREE_GB} GiB floor."
          fi
          echo "Disk usage after cleanup decision:"
          df -h /

      - name: Integration tests (shard 1)
        # The preflight job proves all integration-selected files belong to
        # exactly one manifest before these Docker/testcontainers shards run.
        env:
          COVERAGE_FILE: ${{ runner.temp }}/ci-coverage/coverage-integration-1.data
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/integration-1
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run python scripts/check_ci_test_shards.py run --lane integration --shard 1

      - name: Prepare integration shard 1 duration evidence
        if: always()
        run: |
          python3 scripts/summarize_junit_durations.py \
            --input "${RUNNER_TEMP}/ci-artifacts/integration-1/raw-junit.xml" \
            --sanitized-junit "${RUNNER_TEMP}/ci-artifacts/integration-1/junit.xml" \
            --durations-output "${RUNNER_TEMP}/ci-artifacts/integration-1/top-durations.txt" \
            --limit 25

      - name: Upload integration shard 1 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-integration-1-test-evidence
          path: |
            ${{ runner.temp }}/ci-artifacts/integration-1/junit.xml
            ${{ runner.temp }}/ci-artifacts/integration-1/top-durations.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Upload integration shard 1 coverage data
        if: always()
