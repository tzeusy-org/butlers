        env:
          COVERAGE_FILE: ${{ runner.temp }}/ci-coverage/coverage-unit-${{ matrix.shard }}.data
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.shard }}
          CI_SHARD_TIMINGS: ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.shard }}/shard-observation.json
        run: uv run python scripts/check_ci_test_shards.py run --lane unit --shard ${{ matrix.shard }} --inventory-dir "${RUNNER_TEMP}/ci-inventory"

      - name: Controlled same-count wrong parameter identity
        run: |
          uv run --no-sync python scripts/ci_wrong_parameter_canary.py \
            --receipt "${RUNNER_TEMP}/ci-artifacts/unit-${{ matrix.shard }}/shard-observation.json" \
