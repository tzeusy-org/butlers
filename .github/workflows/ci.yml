          timing_key="$(uv run --no-sync python scripts/check_ci_test_shards.py timing-key --lane unit --shard ${{ matrix.shard }} --inventory-dir "${RUNNER_TEMP}/ci-inventory")"
          printf 'key=%s\n' "$timing_key" >> "$GITHUB_OUTPUT"

      - name: Restore advisory shard timings
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.shard }}/shard-observation.json
          key: ${{ steps.timing-key.outputs.key }}

      - name: Unit tests (shard ${{ matrix.shard }})
