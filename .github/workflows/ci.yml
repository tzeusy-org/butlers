        env:
          TEST_PATHS_JSON: ${{ needs.plan.outputs.test_paths }}
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/ci-artifacts/affected
          # The scoped selection may include integration/db-marked tests
          # (testcontainers), same as the check-integration-* shards.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          mkdir -p "$TEST_EVIDENCE_DIR"
          mapfile -t TEST_PATHS < <(python3 -c "import json, os; print('\n'.join(json.loads(os.environ['TEST_PATHS_JSON'])))")
          echo "Running affected-test lane over: ${TEST_PATHS[*]}"
          uv run pytest "${TEST_PATHS[@]}" -q --tb=short -n auto --dist loadfile \
            --junitxml="$TEST_EVIDENCE_DIR/raw-junit.xml"

      - name: Prepare affected-test duration evidence
        if: always()
        run: |
          python3 scripts/summarize_junit_durations.py \
            --input "${RUNNER_TEMP}/ci-artifacts/affected/raw-junit.xml" \
