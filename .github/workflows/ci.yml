  check-affected:
    # Affected-test lane (bu-v28ho): the `plan` job's evidence when it
    # selected a scoped plan. Runs the planner-selected test paths directly
    # instead of the full ten-shard matrix. Not part of the coverage-combine
    # pipeline in `check` -- this lane trades combined coverage for wall
    # time on the PRs where the planner's selection is precise, and the
    # merge queue's merge_group run still exercises every shard with
    # coverage before anything lands on main.
    runs-on: ubuntu-latest
    needs: [changes, plan]
    # `plan` is conditionally skipped, so this job's `if:` must use always()
    # for the same reason the ten shards do (see their comment): a plain
    # boolean `if:` here would never even be evaluated when `plan` was
    # skipped or failed, and would happen to still be correct today only
    # because `plan` cannot succeed without `changes` having succeeded first
    # -- a chain of implication too fragile to rely on silently.
    if: always() && needs.changes.result == 'success' && github.event_name == 'pull_request' && needs.plan.outputs.mode == 'scoped'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
