        with:
          name: ci-integration-4-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-4

      - name: Download integration shard 5 coverage data
        uses: actions/download-artifact@v4
        with:
          name: ci-integration-5-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-5

      - name: Download integration shard 6 coverage data
        uses: actions/download-artifact@v4
        with:
          name: ci-integration-6-coverage-data
          path: ${{ runner.temp }}/ci-coverage/integration-6

      - name: Combine coverage from all independent test shards
        id: coverage
        env:
          UNIT_1_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-1/coverage-unit-1.data
          UNIT_2_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-2/coverage-unit-2.data
          UNIT_3_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-3/coverage-unit-3.data
          UNIT_4_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-4/coverage-unit-4.data
          UNIT_5_COVERAGE: ${{ runner.temp }}/ci-coverage/unit-5/coverage-unit-5.data
          INTEGRATION_1_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-1/coverage-integration-1.data
          INTEGRATION_2_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-2/coverage-integration-2.data
          INTEGRATION_3_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-3/coverage-integration-3.data
          INTEGRATION_4_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-4/coverage-integration-4.data
          INTEGRATION_6_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-6/coverage-integration-6.data
          INTEGRATION_5_COVERAGE: ${{ runner.temp }}/ci-coverage/integration-5/coverage-integration-5.data
          COMBINED_COVERAGE: ${{ runner.temp }}/ci-coverage/coverage-combined.data
          COMBINED_REPORT: ${{ runner.temp }}/ci-artifacts/coverage/coverage.json
        run: |
          mkdir -p "$(dirname "$COMBINED_COVERAGE")" "$(dirname "$COMBINED_REPORT")"
          rm -f "$COMBINED_COVERAGE" "$COMBINED_REPORT"
          uv run python scripts/check_ci_coverage.py \
            --input-root "${RUNNER_TEMP}/ci-coverage" \
            --inventory-dir "${RUNNER_TEMP}/ci-inventory" \
            --head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          uv run coverage combine --data-file="$COMBINED_COVERAGE" \
            "$UNIT_1_COVERAGE" \
            "$UNIT_2_COVERAGE" \
            "$UNIT_3_COVERAGE" \
            "$UNIT_4_COVERAGE" \
            "$UNIT_5_COVERAGE" \
            "$INTEGRATION_1_COVERAGE" \
            "$INTEGRATION_2_COVERAGE" \
            "$INTEGRATION_3_COVERAGE" \
            "$INTEGRATION_4_COVERAGE" \
            "$INTEGRATION_5_COVERAGE" \
            "$INTEGRATION_6_COVERAGE"
          uv run coverage json --data-file="$COMBINED_COVERAGE" -o "$COMBINED_REPORT"
          uv run coverage report --data-file="$COMBINED_COVERAGE" --show-missing
          export COMBINED_REPORT
          COVERAGE=$(python3 -c 'import json, os; print(round(json.load(open(os.environ["COMBINED_REPORT"]))["totals"]["percent_covered"]))')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          # Color thresholds: green >=80, yellow >=60, red <60.
          if [ "$COVERAGE" -ge 80 ]; then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$COVERAGE" -ge 60 ]; then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ci-combined-coverage-report
          path: ${{ runner.temp }}/ci-artifacts/coverage/coverage.json
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      - name: Update coverage badge
        # Shards no longer run on push:main, so the merge queue's merge_group run
        # is the lane that still has coverage data for the tree about to land.
        # merge_group runs execute in the repository context and see repository
        # secrets; dynamic-badges-action needs only the gist secrets, not the ref.
        if: ${{ success() }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: butlers-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.color }}

  frontend-vitest:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    needs: [route, guards]
    if: needs.route.outputs.frontend == 'true' && needs.guards.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked frontend environment
        working-directory: frontend
        run: npm ci
      - name: Run the exact locked Vitest partition with source-bound evidence
        run: python3 scripts/ci_vitest.py --shard ${{ matrix.shard }} --output "${RUNNER_TEMP}/vitest-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-vitest-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-${{ matrix.shard }}/receipt.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  frontend:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    needs: [route, guards, frontend-vitest]
    if: always()
    steps:
      - name: Required frontend verdict
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          valid = set(needs) == {'route', 'guards', 'frontend-vitest'}
          valid = valid and all(isinstance(v, dict) and v.get('result') in {'success', 'skipped'} for v in needs.values())
          valid = valid and needs['route']['result'] == needs['guards']['result'] == 'success'
          applicable = needs.get('route', {}).get('outputs', {}).get('frontend')
          valid = valid and applicable in {'true', 'false'}
          valid = valid and needs['frontend-vitest']['result'] == ('success' if applicable == 'true' else 'skipped')
          raise SystemExit(0 if valid else 1)
          PY
      - uses: actions/checkout@v6
        if: needs.route.outputs.frontend == 'true'
      - name: Download actual Vitest child one
        if: needs.route.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-vitest-1
          path: ${{ runner.temp }}/vitest-1
      - name: Download actual Vitest child two
        if: needs.route.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-vitest-2
          path: ${{ runner.temp }}/vitest-2
      - name: Independently reconcile both current Vitest populations
        if: needs.route.outputs.frontend == 'true'
        run: python3 scripts/ci_vitest.py --reconcile "${RUNNER_TEMP}/vitest-1/receipt.json" "${RUNNER_TEMP}/vitest-2/receipt.json"

  frontend-e2e:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    needs: [route, guards]
    # merge_group and push:main: always (cheap, no coverage dependency).
    # pull_request: only when frontend/ changed (fail-closed, see `changes`).
    if: github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.route.outputs.frontend == 'true')

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve locked Playwright version
        id: playwright-version
        run: |
          version="$(npm run --silent test:e2e:cache-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Cache is advisory. A failed restore still reaches the mandatory bounded
      # installer, OS dependencies and locked-browser launch verification.
      - name: Cache locked Playwright browsers
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Download the guards build
        uses: actions/download-artifact@v4
        with:
          name: ci-frontend-build
          path: ${{ runner.temp }}/frontend-build

      - name: Validate exact source and build content before browser reuse
        working-directory: .
        run: python3 scripts/ci_frontend_evidence.py consume --artifact "${RUNNER_TEMP}/frontend-build"

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
