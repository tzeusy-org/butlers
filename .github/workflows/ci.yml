        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ci-artifacts/integration-${{ matrix.shard }}/shard-observation.json
          key: ${{ steps.timing-key.outputs.key }}

      - name: Integration tests (shard ${{ matrix.shard }})
