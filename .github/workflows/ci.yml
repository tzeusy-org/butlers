  check-unit:
    timeout-minutes: 28
    runs-on: ubuntu-latest
    needs: [route, guards]
    # Whole-file computed assignment, independently recollected before execution.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    if: needs.route.outputs.mode == 'full' && needs.guards.result == 'success'

    env:
      CI_COVERAGE: ${{ github.event_name == 'merge_group' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.15"

      - name: Install uv
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if timeout 120 bash -c 'set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh'; then
              echo "uv installed on attempt ${attempt}"
