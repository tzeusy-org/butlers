          if-no-files-found: error
          overwrite: true

      - name: Save complete shard timings
        if: success()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ci-artifacts/unit-${{ matrix.shard }}/shard-observation.json
          key: ${{ steps.timing-key.outputs.key }}

      - name: Prepare unit shard ${{ matrix.shard }} duration evidence
        if: always()
        run: |
