name: Session-host causal experiment
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: session-host-causal-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  causal:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'tzeusy-org/butlers' &&
      github.event.pull_request.number == 5479 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'tzeusy-org/butlers' &&
      github.event.pull_request.head.ref == 'agent/bu-m1u7zy.4-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12.15'
      CI_COVERAGE: '0'
      BUTLERS_REQUIRE_SESSION_HOST_NATIVE: '1'
      PROBE_SOURCE_SHA: 13ca133ad8c86f6ba23bf782449fcb9ac145f2da
      PROBE_SOURCE_TREE: 2ce06bffae08d4bb243a1b7af7ae42f4b19df65f
      PROBE_SEAL_SHA256: 332465a8333a4e6a07a8c729831b56fbf744a13fec41fa18c3fa0ba5c8ea5ac6
      PROBE_SOURCES_JSON: '{"pyproject.toml":"2c87d291d0fef9fd1eb7f0086ae608ba83a5d3b3207dde38048174ba8af77015","scripts/runtime_cli_sandbox_init.c":"05e25a6ab61022bc93fcb43541fc6bcbb3d9d03b7bac0dc99084b49aa061f943","scripts/session_host_causal_probe.py":"58ae29f0c6c8c79bd366c9f3e37d356203e32725631613852641af5d61ae4987","scripts/session_host_ci.py":"3064a4e370337513f7070a86fe85ce168c1ebbcdd41ac77293883c126886efe3","scripts/session_host_probe_adapter.py":"86767a519a03f015efa3eee2ee5eed5f3f5684468bfdc9e57af59e41b46b70db","src/butlers/session_host/bubblewrap.py":"1334e8096f44ff351b86664349a0e08d9ee76531f8062cc46323d00c2e3d31d7","src/butlers/session_host/lifecycle.py":"b77f8f6b4506f29e943ee826550c81fcf94030a9d7f586bce99b81cbee794b1c","tests/session_host/test_bubblewrap.py":"20426d3dc17c1b87e66c713dd32196337f0aa3347c1ce01507db907cf873db77","tests/session_host/test_core.py":"4d8d123c28c9059658504fba3067e14d924164cabc46b9be0b8d20632802e41c","uv.lock":"b9bb03b3bee19f8b80ac878c8586729fbc8cbc057ecf3211a1163a7f5e698d3f"}'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 13ca133ad8c86f6ba23bf782449fcb9ac145f2da
          persist-credentials: false
      - name: Verify reviewed source before privileged setup
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B - <<'PYCODE'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git',*args],timeout=10,text=True).strip()
          for key in ('PROBE_SOURCE_SHA','PROBE_SOURCE_TREE','WORKFLOW_SHA','EVENT_SHA','PR_HEAD_SHA'):
              assert re.fullmatch('[0-9a-f]{40}',os.environ[key]), 'source identity refused'
          assert re.fullmatch('[0-9a-f]{64}',os.environ['PROBE_SEAL_SHA256']), 'unsealed source'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted', 'hosted VM required'
          assert git('rev-parse','HEAD') == os.environ['PROBE_SOURCE_SHA']
          assert git('rev-parse','HEAD^{tree}') == os.environ['PROBE_SOURCE_TREE']
          assert git('status','--porcelain') == ''
          sources=json.loads(os.environ['PROBE_SOURCES_JSON'])
          for name,digest in sources.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest
          from scripts import session_host_ci as ci
          assert ci.PACKAGE_SHA256 == '90b02aa006eea7702cd4e851343e469e41365dda42145a3cb035de1d6c773b8c'
          assert ci.PROFILE_SHA256 == '11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9'
          assert ci.RUNNER_PROFILE_SHA256 == 'a964037f6cf0df1099f14226b037eaedde6237c86e715188e93eb460b30be859'
          PYCODE
      - name: Set up the CI Python environment
        uses: ./.github/actions/ci-python-environment
      - name: Install native proof prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap build-essential openssl
      - name: Execute only the reviewed causal experiment
        timeout-minutes: 6
        run: uv run --no-sync python -B scripts/session_host_causal_probe.py --execute --disposable-job
      # Default success() is deliberate: failure/quarantine has no later work.
      - name: Stage only closed successful evidence
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --no-sync python -B - <<'PYCODE'
          import hashlib,json,os,re,stat
          from scripts import session_host_causal_probe as probe
          from scripts import session_host_ci as ci
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'butlers-session-host-causal'/'probe-report.json'
          parent=path.parent.lstat()
          assert stat.S_ISDIR(parent.st_mode) and parent.st_uid==os.geteuid()
          assert stat.S_IMODE(parent.st_mode)==0o700
          fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
              info=os.fstat(fd)
              assert stat.S_ISREG(info.st_mode) and info.st_uid==os.geteuid() and info.st_nlink==1
              assert stat.S_IMODE(info.st_mode)==0o600
              assert 0 < info.st_size <= 262144
              raw=os.read(fd,262145)
              assert len(raw)==info.st_size and os.read(fd,1)==b''
              after=os.fstat(fd)
              assert (after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns)==(info.st_dev,info.st_ino,info.st_size,info.st_mtime_ns,info.st_ctime_ns)
          finally:
              os.close(fd)
          def unique(pairs):
              result={}
              for key,value in pairs:
                  assert key not in result, 'duplicate report key'
                  result[key]=value
              return result
          def no_constant(value):
              raise ValueError('nonfinite report number')
          report=json.loads(raw,object_pairs_hook=unique,parse_constant=no_constant)
          probe.closed_report(
              report,
              run_id=os.environ['GITHUB_RUN_ID'],
              attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              head=os.environ['PROBE_SOURCE_SHA'],
              tree=os.environ['PROBE_SOURCE_TREE'],
              sources=json.loads(os.environ['PROBE_SOURCES_JSON']),
          )
          binding={k:os.environ[k] for k in ('PROBE_SOURCE_SHA','PROBE_SOURCE_TREE','PROBE_SEAL_SHA256','WORKFLOW_SHA','EVENT_SHA','PR_HEAD_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')}
          binding['report_sha256']=hashlib.sha256(raw).hexdigest()
          out=Path(os.environ['RUNNER_TEMP'])/'session-host-causal-closed-evidence'
          out.mkdir(mode=0o700)
          (out/'report.json').write_bytes(raw)
          (out/'binding.json').write_text(json.dumps(binding,sort_keys=True)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: session-host-causal-closed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/session-host-causal-closed-evidence/report.json
            ${{ runner.temp }}/session-host-causal-closed-evidence/binding.json
          if-no-files-found: error
          retention-days: 7
