# Namespace butlers-public-dev. Reads postgres-dev, the LIVE database despite the name.
env: dev

database:
  host: postgres-dev-rw.postgres-dev.svc.cluster.local
  clusterNamespace: postgres-dev
  clusterName: postgres-dev

# Site host is never committed: make deploy-dev passes --set dashboardBase from BUTLERS_PUBLIC_HOST.
dashboardBase: https://butlers.invalid/butlers-dev
