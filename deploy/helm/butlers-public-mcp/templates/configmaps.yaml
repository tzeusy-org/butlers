apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keyring
  namespace: {{ include "pub.namespace" . }}
  labels:
    {{- include "pub.labels" . | nindent 4 }}
data:
  keyring.json: |
    {{ .Values.keyringJson | fromJson | toJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-switches
  namespace: {{ include "pub.namespace" . }}
  labels:
    {{- include "pub.labels" . | nindent 4 }}
data:
  switches.json: |
    {{ .Values.switchesJson | fromJson | toJson }}
