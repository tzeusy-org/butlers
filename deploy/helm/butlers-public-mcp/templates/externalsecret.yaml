# Values come from Bitwarden through the ClusterSecretStore; no value is in this chart.
# Each file the server reads is its own key; the server reads files, not env, for secrets.
{{- $ns := include "pub.namespace" . }}
{{- $e := .Values.externalSecrets }}
{{- $secrets := list
  (dict "suffix" "db" "data" (list (dict "key" "password" "from" $e.dbPasswordKey)))
  (dict "suffix" "bearer" "data" (concat
    (list (dict "key" "digest" "from" $e.bearerDigestKey))
    (ternary (list (dict "key" "digest_next" "from" $e.bearerDigestNextKey)) (list) (ne (toString $e.bearerDigestNextKey) ""))))
  (dict "suffix" "canaries" "data" (list (dict "key" "canaries.json" "from" $e.canariesKey)))
}}
{{- range $i, $secret := $secrets }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Release.Name }}-{{ $secret.suffix }}
  namespace: {{ $ns }}
  labels:
    {{- include "pub.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    name: {{ $e.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ $.Release.Name }}-{{ $secret.suffix }}
    creationPolicy: Owner
  data:
    {{- range $secret.data }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .from | quote }}
    {{- end }}
{{- end }}
