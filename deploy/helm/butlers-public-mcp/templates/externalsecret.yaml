# Values come from Bitwarden through the ClusterSecretStore; no value is in this chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db
  namespace: {{ include "pub.namespace" . }}
  labels:
    {{- include "pub.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-db
    creationPolicy: Owner
  data:
    - secretKey: MCP_PUBLIC_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.dbPasswordKey | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-bearer
  namespace: {{ include "pub.namespace" . }}
  labels:
    {{- include "pub.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-bearer
    creationPolicy: Owner
  data:
    - secretKey: digest
      remoteRef:
        key: {{ .Values.externalSecrets.bearerDigestKey | quote }}
