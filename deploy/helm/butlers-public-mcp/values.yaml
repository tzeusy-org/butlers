# Defaults. values.dev.yaml supplies the environment. There is no values.prod.yaml: prod rollout
# is deferred (RFC 0039 OD18), and `env` is required so this file alone renders nothing.
env: ""

image:
  # Same image and TAG as the butlers chart. Site registry: `--set image.repository=...`.
  repository: registry.invalid/butlers-app
  tag: ""
  pullPolicy: IfNotPresent

# The shared CNPG cluster `postgres-<env>`: its read-write service, namespace and instance-pod
# labels are derived from `env` in the templates and are not values. The network allows (mcp
# filter-proxy, monitoring, postgres, kube-dns), the ports (8080, 9090) and the replica count
# (1) are fixed by RFC 0039 D8 and the host, so no value can widen or change them: setting
# `networkPolicy`, `ports`, `database.host`, `database.port`, `database.clusterNamespace`,
# `database.clusterName` or a `replicas` other than 1 fails the render.
database:
  name: butlers_public
  user: mcp_public_ro

# Dashboard base URL the server puts in card links (MCP_PUBLIC_DASHBOARD_BASE).
dashboardBase: ""

externalSecrets:
  storeRef: bitwarden-secretsmanager-dev
  refreshInterval: 1h
  # Bitwarden item names. The password is custody of this chart only (RFC 0039 D9).
  dbPasswordKey: MCP_PUBLIC_RO_DB_PASSWORD
  # Lowercase hex SHA-256 of the hop bearer (UPSTREAM_BEARER), no prefix, never the bearer (D6).
  bearerDigestKey: MCP_PUBLIC_HOP_BEARER_DIGEST
  # Optional second digest for a rotation overlap (served as bearer/digest_next). Empty: none.
  bearerDigestNextKey: ""
  # REQUIRED by the server: a JSON list of canary strings (each at least 8 characters, D15).
  # Missing, invalid or EMPTY, every tool refuses: the Bitwarden item must hold a JSON list with
  # at least one string of 8 or more characters (a chart cannot read the item's content).
  canariesKey: MCP_PUBLIC_CANARIES

# Verifier keyring, the runtime_probe_control document (version, current, retiring[]) rendered
# verbatim as keyring.json. Empty until owner act 4 hands over the public key and kid: the server
# then verifies nothing and refuses every call (it does not crash).
keyringJson: ""

# Break-glass kill switch (D16): the `disabled_domains` file, one domain or `all` per line, `#`
# comments. Re-read every 10 s. Default: a comment only, so nothing is disabled. An unknown entry
# disables everything.
disabledDomains: |
  # one domain per line, or `all`; empty means nothing is disabled

# Server identity settings. audience (https URL of the public MCP endpoint) and allowedSubs
# (comma-separated owner subjects) are REQUIRED, site values that are never committed:
# scripts/k8s/public-mcp-chart-deploy.sh passes them from BUTLERS_PUBLIC_MCP_AUDIENCE and
# BUTLERS_PUBLIC_MCP_ALLOWED_SUBS. clientDomains defaults to claude.ai,chatgpt.com in the server.
audience: ""
allowedSubs: ""
clientDomains: ""
registeredClients: ""

securityContext:
  runAsUser: 10001
  runAsGroup: 10001

resources:
  requests: {cpu: 50m, memory: 256Mi}
  limits: {memory: 1Gi}

# Metrics scraping and alerting for the public surface (RFC 0039 D16, REQ-public-mcp-authorization-014).
# Off by default: the CRDs need the Prometheus Operator, and `labels` must match the cluster
# Prometheus' podMonitorSelector / ruleSelector (kube-prometheus-stack in `lgtm`: release=lgtm,
# set in values.dev.yaml). Neither object adds ingress: the NetworkPolicy already admits `lgtm` on 9090.
monitoring:
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}
  rules:
    enabled: false
    labels: {}
    interval: 1m
    # Every alert threshold is configuration (REQ-public-mcp-authorization-014).
    thresholds:
      # Critical: a narrowing left pending this long (D16). The widening warning has no delay.
      narrowingPendingFor: 24h
      # Critical: 50 % of the cluster's max_slot_wal_keep_size, in bytes. 10GB on dev -> 5 GiB.
      # Keep in step with cluster.postgresql.parameters.max_slot_wal_keep_size (no metric exposes it).
      slotRetainedWalBytes: 5368709120
      # Warning: a logical slot inactive this long.
      slotInactiveFor: 10m
      redactionsPerHour: 20
      assertionFailuresPer5m: 10
      bearerRefusalsPer5m: 20
      # Finance or health rows served to one client label in an hour.
      rowsServedPerHour: 2000
      inboxUndrained: 500
      # How long an "any event" alert (canary hit, DLP drop, apply_failed) stays firing, long
      # enough for Uptime Kuma's poll to see it.
      eventWindow: 15m
