# Namespace butlers-dev. Targets postgres-dev (butlers-db-dev), which is the
# LIVE database despite the name. Mirrors `./scripts/compose.sh` (dev mode).
database:
  host: postgres-dev-rw.postgres-dev.svc.cluster.local
  apiPoolMaxSize: 4

externalSecrets:
  storeRef: bitwarden-secretsmanager-dev
  localEnv:
    # Not provisioned on dev; the dashboard runs without it.
    DASHBOARD_API_KEY: ""

# butlers-runtime-probe-control and butlers-local-env come from BWS on dev.
localSecrets:
  source: bws

publicUrl:
  dashboardPrefix: butlers-dev
  apiPrefix: butlers-dev-api
  owntracksPrefix: owntracks-dev

nodePorts:
  frontend: 32173
  dashboard: 32200
  owntracks: 32086

dashboardAuth:
  enabled: true
  deployment: dev
  # cni0 (host -> pod on this node) and flannel.1 (host -> pod on another node).
  trustedProxyPeers: 10.42.0.1,10.42.0.0

commonEnv:
  BUTLERS_RECEIVER_DERIVED_ROUTE_CUTOVER: "1"
  BUTLERS_FLEET_CONDITION_HANDOFF: "1"
  # Decision Desk prompts send real Telegram messages to the owner; stays off
  # until the owner consents to live prompts (bu-ckkpz.3).
  BUTLERS_DECISION_ROUTING_ENABLED: "0"
  # The weekly decision-review digest and the P1/deploy escalation check also
  # message the owner; on in dev by owner decision 2026-10-08 (bu-ckkpz). The
  # export and /api/decisions do not depend on this flag.
  BUTLERS_DECISION_REVIEW_ENABLED: "1"

# Bridge retired; keep every runtime pod isolated from the engineering tracker.
trackerEgress:
  enabled: true

# Owner decision 2026-11-08 (domain-egress-dev-enable = B): private/tailnet egress is
# allowlist-only in dev, smoke-tested in a rehearsal namespace. The allowlist is site
# input (ALLOWED_TAILNET_HOSTS via scripts/k8s/site-helm-args.sh); rendering refuses
# without it. Host set: docs/operations/kubernetes-deployment.md (egress policy); no
# prod change.
egressPolicy:
  enabled: true

# Owner-approved 2026-11-04 temporary cohosting for RFC 0023 same-PID approval
# recovery. Actual rollout is exclusive and data-preserving; see
# docs/operations/approval-delivery-dev-rollout.md. Split support stays opt-in.
butlersControl:
  enabled: false
