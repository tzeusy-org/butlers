# Namespace butlers-dev. Targets postgres-dev (butlers-db-dev), which is the
# LIVE database despite the name. Mirrors `./scripts/compose.sh` (dev mode).
database:
  host: postgres-dev-rw.postgres-dev.svc.cluster.local
  apiPoolMaxSize: 4

externalSecrets:
  storeRef: bitwarden-secretsmanager-dev
  localEnv:
    # Not provisioned on dev; the dashboard runs without it.
    DASHBOARD_API_KEY: ""

# butlers-runtime-probe-control and butlers-local-env come from BWS on dev.
localSecrets:
  source: bws

publicUrl:
  dashboardPrefix: butlers-dev
  apiPrefix: butlers-dev-api
  owntracksPrefix: owntracks-dev

nodePorts:
  frontend: 32173
  dashboard: 32200
  owntracks: 32086

dashboardAuth:
  enabled: true
  deployment: dev
  trustedProxyPeers: 10.42.0.1

commonEnv:
  BUTLERS_RECEIVER_DERIVED_ROUTE_CUTOVER: "1"
  # Decision Desk prompts send real Telegram messages to the owner; stays off
  # until the owner consents to live prompts (bu-ckkpz.3).
  BUTLERS_DECISION_ROUTING_ENABLED: "0"

# Tracker bridge enabled by owner ruling 2026-10-08 (bu-sng0tu). Host, CIDR and
# image repository come from scripts/k8s/site-helm-args.sh.
beadsExport:
  enabled: true
  schedule: "*/5 * * * *"
  credentialBwsKeys:
    user: BUTLERS_RUNTIME_BEADS_DOLT_USER
    password: BUTLERS_RUNTIME_BEADS_DOLT_PASSWORD
