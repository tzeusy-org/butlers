{{- $metrics := .Values.connectorMetrics }}
{{- range $name, $c := .Values.connectors }}
{{- if ne (toString $c.enabled) "false" }}
{{- $scraped := and $metrics.enabled $c.healthPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-{{ $name }}
  labels:
    {{- include "butlers.labels" $ | nindent 4 }}
spec:
  replicas: {{ if $.Values.suspend }}0{{ else }}1{{ end }}
  # Pollers and long-lived sessions (Telegram, WhatsApp) must not overlap.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "butlers.selector" (dict "root" $ "component" (printf "connector-%s" $name)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "butlers.selector" (dict "root" $ "component" (printf "connector-%s" $name)) | nindent 8 }}
        {{- if $scraped }}
        butlers.io/connector-metrics: "true"
        {{- end }}
      {{- if and $scraped $metrics.annotations }}
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/job: connector-{{ $name }}
        k8s.grafana.com/metrics.portName: metrics
        k8s.grafana.com/metrics.path: /metrics
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      initContainers:
        {{- if $c.oauth }}
        {{- include "butlers.oauthGate" $ | nindent 8 }}
        {{- end }}
        {{- include "butlers.waitFor" (dict "root" $ "name" "butlers-up" "url" (printf "http://%s:41100/health" (include "butlers.switchboardHost" $))) | nindent 8 }}
        {{- if $c.waitForHealthRoutes }}
        - name: wait-for-health-routes
          image: {{ include "butlers.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["uv", "run", "--frozen", "--no-dev", "python", "scripts/wait_for_butler_routes.py"]
          args: ["--url", "http://butlers-up:41103/internal/control-plane/identity", "--butler", "health"]
        {{- end }}
      containers:
        - name: connector
          image: {{ include "butlers.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - /app/scripts/dev_entrypoint.sh
            - connectors/{{ $c.logSubdir }}
            - uv
            - run
            - --frozen
            - --no-dev
            - python
            - -m
            - butlers.connectors.{{ $c.module }}
          env:
            {{- include "butlers.postgresEnv" $ | nindent 12 }}
            - {name: SWITCHBOARD_MCP_URL, value: "http://{{ include "butlers.switchboardHost" $ }}:41100/sse"}
            - {name: CONNECTOR_PROVIDER, value: {{ $c.provider | quote }}}
            - {name: CONNECTOR_CHANNEL, value: {{ $c.channel | quote }}}
            {{- if $c.healthPort }}
            - {name: CONNECTOR_HEALTH_PORT, value: {{ $c.healthPort | quote }}}
            {{- end }}
            {{- if $c.sharedDb }}
            - {name: CONNECTOR_BUTLER_DB_NAME, value: {{ $.Values.database.name | quote }}}
            - {name: BUTLER_SHARED_DB_NAME, value: {{ $.Values.database.name | quote }}}
            - {name: BUTLER_SHARED_DB_SCHEMA, value: shared}
            {{- end }}
            {{- range $k, $v := $c.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          {{- if $c.healthPort }}
          ports:
            - {name: health, containerPort: {{ $c.healthPort }}}
          readinessProbe:
            # Most connector health servers bind 127.0.0.1, so probe in-pod
            # (as the compose healthchecks did).
            exec:
              command: ["curl", "-sf", "http://localhost:{{ $c.healthPort }}/health"]
            periodSeconds: 10
            timeoutSeconds: 5
          {{- end }}
          resources:
            {{- toYaml (default $.Values.connectorDefaults.resources $c.resources) | nindent 12 }}
          volumeMounts:
            - {name: logs, mountPath: /app/logs}
            {{- if $c.waBridge }}
            - {name: wa-bridge, mountPath: /tmp/wa-bridge}
            {{- end }}
        {{- if $scraped }}
        # Republishes only GET /metrics from the loopback health server.
        - name: metrics-proxy
          image: {{ include "butlers.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - python3
            - /app/scripts/connector_metrics_proxy.py
            - --upstream-port={{ $c.healthPort }}
            - --listen-port={{ $metrics.port }}
          ports:
            - {name: metrics, containerPort: {{ $metrics.port }}}
          resources:
            {{- toYaml $metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- include "butlers.logsVolume" $ | nindent 8 }}
        {{- if $c.waBridge }}
        - name: wa-bridge
          persistentVolumeClaim: {claimName: {{ $.Release.Name }}-wa-bridge}
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.nodePorts.owntracks }}
---
apiVersion: v1
kind: Service
metadata:
  name: connector-owntracks-host
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    {{- include "butlers.selector" (dict "root" . "component" "connector-owntracks") | nindent 4 }}
  ports:
    - {name: http, port: 40086, targetPort: 40086, nodePort: {{ .Values.nodePorts.owntracks }}}
{{- end }}
