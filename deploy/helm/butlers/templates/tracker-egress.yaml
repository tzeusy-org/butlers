{{- /*
With egressPolicy.enabled this one policy also mirrors scripts/egress-firewall.sh: the
private ranges are excluded from the public rule and each allowlisted CIDR is admitted
explicitly. NetworkPolicies are additive, so a second egress policy selecting the same
pods could not narrow this one; keep exactly one. egressProfiles.enabled replaces it
with the per-workload policies in egress-profiles.yaml and renders it not at all.
*/ -}}
{{- if or .Values.trackerEgress.enabled .Values.egressPolicy.enabled }}
{{- if and .Values.trackerEgress.enabled (not .Values.trackerEgress.deniedCidrs) }}
{{- fail "trackerEgress.deniedCidrs is required when trackerEgress.enabled (scripts/k8s/site-helm-args.sh resolves it)" }}
{{- end }}
{{- if and .Values.egressPolicy.enabled (not .Values.egressPolicy.allowedCidrs) (not .Values.egressPolicy.allowNoAllowlist) }}
{{- fail "egressPolicy.allowedCidrs is required when egressPolicy.enabled (scripts/k8s/site-helm-args.sh maps ALLOWED_TAILNET_HOSTS to it); set egressPolicy.allowNoAllowlist=true only to deny every private address" }}
{{- end }}
{{- if and .Values.egressPolicy.enabled .Values.trackerEgress.enabled }}
{{- range .Values.egressPolicy.allowedCidrs }}
{{- if has . $.Values.trackerEgress.deniedCidrs }}
{{- fail (printf "egressPolicy.allowedCidrs entry %s is also in trackerEgress.deniedCidrs; allow rules are additive and would re-admit the tracker" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Declared profiles replace this policy entirely (templates/egress-profiles.yaml). */}}
{{- if not .Values.egressProfiles.enabled }}
# The retired bridge grants no pod an exception. Retain the existing IPv4-only
# tracker boundary independently of all product features and credentials.
# Site configuration must cover every tracker IPv4 address; no CIDR means refusal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-tracker-egress
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
    {{- if .Values.egressPolicy.enabled }}
    {{- /* Explicit DNS admission; also covered by the namespaceSelector rule above. */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- range .Values.egressPolicy.allowedCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
    {{- end }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.trackerEgress.deniedCidrs }}
              - {{ . }}
              {{- end }}
              {{- if .Values.egressPolicy.enabled }}
              {{- range .Values.egressPolicy.privateCidrs }}
              - {{ . }}
              {{- end }}
              {{- end }}
{{- end }}
{{- end }}
