apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "butlers.bwsSecret" . }}
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "butlers.bwsSecret" . }}
    creationPolicy: Owner
  data:
    {{- range $envName, $bwsKey := .Values.externalSecrets.data }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $bwsKey | quote }}
    {{- end }}
