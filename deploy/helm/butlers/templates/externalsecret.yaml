apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "butlers.bwsSecret" . }}
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "butlers.bwsSecret" . }}
    creationPolicy: Owner
  data:
    {{- range $envName, $bwsKey := .Values.externalSecrets.data }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $bwsKey | quote }}
    {{- end }}
    {{- /* Synced only when enabled: a missing remote key fails the whole Secret's sync. */}}
    {{- if eq (toString .Values.database.migratorLogin.enabled) "true" }}
    {{- range $envName, $bwsKey := .Values.externalSecrets.migratorData }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ required (printf "externalSecrets.migratorData.%s is required" $envName) $bwsKey | quote }}
    {{- end }}
    {{- end }}
