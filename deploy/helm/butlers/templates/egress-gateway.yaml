{{- /*
The shared egress gateway (RFC 0038 S7, bu-dhloi1.15), rendered only with
egressProfiles.enabled. Each listener selects a profile and authenticates its workload
through mTLS. Both the workload and gateway NetworkPolicies constrain the same port.
The gateway alone may dial public addresses on the ports the profiles declare.
*/ -}}
{{- if include "butlers.egressProfilesEnabled" . }}
{{- $doc := .Files.Get "files/egress-profiles.json" | fromJson }}
{{- $g := .Values.egressProfiles.gateway }}
{{- $routes := list }}
{{- $externalPorts := list }}
{{- range $name, $p := $doc.workloads }}
{{- if and $p.gateway_port (not $p.held) }}
{{- $routes = append $routes (dict "workload" $name "port" (int $p.gateway_port)) }}
{{- range $p.external }}
{{- $externalPorts = append $externalPorts (int .port) }}
{{- end }}
{{- end }}
{{- end }}
{{- $externalPorts = $externalPorts | uniq | sortAlpha }}
{{- if not (and (kindIs "map" $g.clientPins) (kindIs "map" $g.clientSecrets)) }}
{{- fail "egressProfiles.gateway.clientPins and clientSecrets must map workloads to credentials" }}
{{- end }}
{{- if or (ne (len $g.clientPins) (len $routes)) (ne (len $g.clientSecrets) (len $routes)) }}
{{- fail "egressProfiles.gateway.clientPins and clientSecrets must cover every workload listener exactly" }}
{{- end }}
{{- $secretNames := dict }}
{{- $pins := dict }}
{{- $credentials := list $g.tlsSecret }}
{{- range $routes }}
{{- $pin := get $g.clientPins .workload }}
{{- if not (and (kindIs "string" $pin) (regexMatch "^[0-9a-f]{64}$" (toString $pin))) }}
{{- fail (printf "egressProfiles.gateway.clientPins requires a SHA-256 fingerprint for %s" .workload) }}
{{- end }}
{{- if hasKey $pins $pin }}
{{- fail "egressProfiles.gateway.clientPins must bind distinct workload certificates" }}
{{- end }}
{{- $_ := set $pins $pin true }}
{{- $credentials = append $credentials (get $g.clientSecrets .workload) }}
{{- end }}
{{- range $credentials }}
{{- if not (and (kindIs "string" .) (le (len (toString .)) 63) (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" (toString .))) }}
{{- fail "egressProfiles.gateway.tlsSecret and clientSecrets must name gateway TLS Secrets" }}
{{- end }}
{{- if or (hasKey $secretNames .) (eq . (printf "%s-bws" $.Release.Name)) (eq . $.Values.sessionHost.pkiSecret) }}
{{- fail "egressProfiles.gateway.tlsSecret and clientSecrets must name distinct gateway-only Secrets" }}
{{- end }}
{{- $_ := set $secretNames . true }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-egress-profiles
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
data:
  egress-profiles.json: |
{{ .Files.Get "files/egress-profiles.json" | indent 4 }}
  client-pins.json: {{ $g.clientPins | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-gateway
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  replicas: {{ if $.Values.suspend }}0{{ else }}{{ int $g.replicas }}{{ end }}
  selector:
    matchLabels:
      {{- include "butlers.selector" (dict "root" . "component" "egress-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "butlers.selector" (dict "root" . "component" "egress-gateway") | nindent 8 }}
      annotations:
        checksum/egress-profiles: {{ .Files.Get "files/egress-profiles.json" | sha256sum }}
        checksum/egress-client-pins: {{ $g.clientPins | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: {{ include "butlers.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/python", "-I", "/app/scripts/runtime_clis/python_entrypoint.py", "python", "-m", "butlers.egress.gateway", "--profiles", "/etc/butlers-egress/egress-profiles.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: health, containerPort: 3100}
            {{- range $routes }}
            - {name: gw-{{ .port }}, containerPort: {{ .port }}}
            {{- end }}
          readinessProbe:
            tcpSocket: {port: health}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: health}
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: /etc/butlers-egress, readOnly: true}
            - {name: egress-tls, mountPath: /var/run/butlers-egress-tls, readOnly: true}
      volumes:
        - name: profiles
          configMap:
            name: {{ .Release.Name }}-egress-profiles
        {{- include "butlers.egressTLSVolume" $g.tlsSecret | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: egress-gateway
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "butlers.selector" (dict "root" . "component" "egress-gateway") | nindent 4 }}
  ports:
    {{- range $routes }}
    - {name: gw-{{ .port }}, port: {{ .port }}, targetPort: {{ .port }}}
    {{- end }}
---
# Each workload reaches only its own gateway port. The gateway is excluded from
# <release>-namespace-ingress so nothing unions a wider rule onto it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress-gateway-ingress
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "butlers.selector" (dict "root" . "component" "egress-gateway") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- range $routes }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "butlers.selector" (dict "root" $ "component" .workload) | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .port }}}
    {{- end }}
---
# The gateway's own egress: DNS, and public addresses on declared external ports only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress-egress-gateway
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "butlers.selector" (dict "root" . "component" "egress-gateway") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.egressPolicy.privateCidrs }}
              - {{ . }}
              {{- end }}
              {{- range $g.deniedCidrs }}
              - {{ . }}
              {{- end }}
              {{- range .Values.trackerEgress.deniedCidrs }}
              - {{ . }}
              {{- end }}
      ports:
        {{- range $externalPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
