{{- if eq .Values.localSecrets.source "bws" }}
{{- $probe := .Values.externalSecrets.runtimeProbeControl }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.localSecrets.runtimeProbeControlSecretName }}
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.localSecrets.runtimeProbeControlSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: runtime_probe_control_signing_key
      remoteRef:
        key: {{ required "externalSecrets.runtimeProbeControl.signingKey is required when localSecrets.source=bws" $probe.signingKey | quote }}
    - secretKey: runtime_probe_control_verifiers
      remoteRef:
        key: {{ required "externalSecrets.runtimeProbeControl.verifiers is required when localSecrets.source=bws" $probe.verifiers | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.localSecrets.envSecretName }}
  labels:
    {{- include "butlers.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.localSecrets.envSecretName }}
    creationPolicy: Owner
  data:
    {{- range $envName, $bwsKey := .Values.externalSecrets.localEnv }}
    {{- if $bwsKey }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $bwsKey | quote }}
    {{- end }}
    {{- end }}
{{- end }}
