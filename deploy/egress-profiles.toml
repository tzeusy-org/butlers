# Reviewed egress profiles: one per chart workload (RFC 0038 S7, bu-dhloi1.15).
#
# Egress widens only by a reviewed change to this file (owner decision bu-l8y3fn = B):
# there is no runtime widening tool or API. `make egress-profiles` renders it into
# deploy/helm/butlers/files/egress-profiles.json, which the chart reads when
# egressProfiles.enabled is true (default off). See docs/operations/egress-profiles.md.
#
# Each [workloads.<component>] table names one `app.kubernetes.io/component` label and
# declares two disjoint route classes:
#   internal  - exact chart peers: {component, port[, end_port][, protocol]}
#   sites     - site-located internal peers: {site, port[, protocol][, optional]}. The
#               profile owns the port; deployment values supply only the location
#               (namespace selector or one /32) under egressProfiles.sites.<site>.
#   external  - exact public "hostname:port" entries, reachable only through the shared
#               gateway on this workload's gateway_port. No IP literals, no wildcards.
#   dynamic   - configured destinations deliberately NOT admitted, with the reason.
#   held      - set to a reason when the workload cannot be enforced yet; rendering
#               with that workload enabled fails instead of admitting it.
# Every workload also gets cluster DNS. Anything not declared is denied.

schema = "butlers-egress-profiles/v1"

# Model-provider and package hosts repeat across workloads on purpose: each profile is
# reviewed on its own and grants nothing to another workload.

[workloads.butlers-up]
summary = "Domain butler daemons, their modules and the LLM CLIs they spawn"
gateway_port = 3101
internal = [
  { component = "butlers-up", port = 41100, end_port = 41112 },
  { component = "butlers-control", port = 41100 },
  { component = "dashboard-api", port = 41200 },
]
sites = [
  { site = "database", port = 5432 },
  { site = "otlp", port = 4318 },
  { site = "home-assistant", port = 8123, optional = true },
  # Messenger verifies Switchboard's delivery token against the issuer JWKS
  # (service plane, bu-2c1g7v). Required when servicePlaneAuth.enabled.
  { site = "kube-apiserver", port = 6443, optional = true },
]
external = [
  # Startup `uv sync --dev` (butlers-up.yaml).
  "pypi.org:443",
  "files.pythonhosted.org:443",
  # Model providers for spawned runtimes.
  "api.anthropic.com:443",
  "api.openai.com:443",
  "chatgpt.com:443",
  "auth.openai.com:443",
  "generativelanguage.googleapis.com:443",
  # Module and job APIs.
  "api.telegram.org:443",
  "oauth2.googleapis.com:443",
  "www.googleapis.com:443",
  "people.googleapis.com:443",
  "gmail.googleapis.com:443",
  "api.spotify.com:443",
  "accounts.spotify.com:443",
  "api.steampowered.com:443",
  "api.open-meteo.com:443",
  "air-quality-api.open-meteo.com:443",
  "geocoding-api.open-meteo.com:443",
  "api.aviationstack.com:443",
  "api.github.com:443",
  "github.com:443",
]
dynamic = [
  { source = "local:claude", reason = "Supported API-base and MCP configuration are named in the source inventory; opaque native auth/tool destinations remain unproven and gain no route" },
  { source = "vendor:codex", reason = "Reviewed CLI/provider/auth/model/plugin resolver inventory; only exact existing profile origins may pass; arbitrary results and undeclared native tools remain denied" },
  { source = "vendor:gemini", reason = "Reviewed CLI/provider/auth/model/plugin resolver inventory; only exact existing profile origins may pass; arbitrary results and undeclared native tools remain denied" },
  { source = "vendor:google-auth-library", reason = "Reviewed CLI/provider/auth/model/plugin resolver inventory; only exact existing profile origins may pass; arbitrary results and undeclared native tools remain denied" },
  { source = "vendor:js-genai", reason = "Reviewed CLI/provider/auth/model/plugin resolver inventory; only exact existing profile origins may pass; arbitrary results and undeclared native tools remain denied" },
  { source = "vendor:opencode", reason = "Reviewed CLI/provider/auth/model/plugin resolver inventory; only exact existing profile origins may pass; arbitrary results and undeclared native tools remain denied" },
  { source = "ANTHROPIC_BASE_URL", reason = "CLI base override: only already-declared exact origins may pass; no destination is granted by this metadata" },
  { source = "src/butlers/core/qa/github_pr.py:GithubPrClient._fetch_uncached", reason = "QA repository/API resolver: only already-declared exact origins may pass; arbitrary results remain denied" },
  { source = "src/butlers/core/qa/publication/github_reader.py:GithubPublicationReader._client", reason = "QA repository/API resolver: only already-declared exact origins may pass; arbitrary results remain denied" },
  { source = "src/butlers/core/qa/repo_clone.py:ManagedRepoClone._read_repo_url", reason = "QA repository/API resolver: only already-declared exact origins may pass; arbitrary results remain denied" },
  { source = "LIVE_LISTENER_TRANSCRIPTION_URL", reason = "site-configured; not admitted until declared as a site peer" },
]

