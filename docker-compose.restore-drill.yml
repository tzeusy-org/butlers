# Protected restore-drill Compose fragment.
#
# This file is intentionally absent from bare `docker compose` invocations.
# Only scripts/compose.sh and `butlers deploy` are supported launchers for it;
# they include it after they have
# stopped the prior executor and relay, obtained a root-owned generation-bound
# capability, created the protected topology, and installed the relay and
# executor-bridge default-deny policies before either service starts.
# The internal network limits membership, but only the prepared firewall also
# denies its Docker gateway and host paths. Direct rendering is inspection
# only; do not use this fragment to start services manually.

services:
  # This uncredentialed raw-TCP relay is the only service with a route from
  # the executor's internal network to the firewall-controlled PostgreSQL
  # bridge. It dials a required, resolved IPv4 endpoint only; it never reads
  # the recovery password, shared POSTGRES_* variables, or a DATABASE_URL.
  restore-drill-postgres-proxy:
    image: butlers-app:${BUTLERS_APP_TAG:-latest}
    entrypoint: ["python", "/app/scripts/restore_drill_tcp_proxy.py"]
    command: []
    environment:
      RESTORE_DRILL_PROXY_DB_HOST: ${RESTORE_DRILL_EXECUTOR_FIREWALL_DB_HOST:?Run a supported launcher to provide the resolved PostgreSQL IPv4 endpoint}
      RESTORE_DRILL_PROXY_DB_PORT: ${RESTORE_DRILL_EXECUTOR_DB_PORT:-5432}
    networks:
      # The firewall script keys this non-internal bridge by project name and
      # permits this uncredentialed relay only to the resolved PostgreSQL IP.
      restore_drill_db:
      # The executor's DNS/TLS hostname (never a numeric literal) resolves to
      # this relay only inside the internal network. Raw TLS then reaches
      # PostgreSQL unchanged.
      restore_drill_executor:
        aliases:
          - ${RESTORE_DRILL_EXECUTOR_DB_HOST:?Run a supported launcher to provide the PostgreSQL TLS DNS hostname}
    restart: "no"

  # The sole holder of the recovery-only database credential. It has no HTTP
  # listener and deliberately does not inherit x-postgres-env: dashboard-api,
  # butlers, and connectors remain unable to create the scratch database. Its
  # only network is internal; its configured TLS name reaches the relay above,
  # never the external PostgreSQL address directly.
  restore-drill-executor:
    image: butlers-app:${BUTLERS_APP_TAG:-latest}
    entrypoint: ["uv", "run", "--frozen", "--no-dev", "python", "-m", "butlers.jobs.restore_drill_executor"]
    command: []
    environment:
      RESTORE_DRILL_EXECUTOR_DB_HOST: ${RESTORE_DRILL_EXECUTOR_DB_HOST:?Run a supported launcher to provide the PostgreSQL TLS DNS hostname}
      RESTORE_DRILL_EXECUTOR_DB_PORT: ${RESTORE_DRILL_EXECUTOR_DB_PORT:-5432}
      RESTORE_DRILL_EXECUTOR_FIREWALL_PROJECT: ${COMPOSE_PROJECT_NAME:?Run a supported launcher to prepare the executor firewall}
      # The root-owned prepare verb generates this for each `compose create`.
      # Its post-fence marker binds the nonce to this exact container generation;
      # the invalid default makes a direct merged invocation fail before secret use.
      RESTORE_DRILL_EXECUTOR_FIREWALL_CAPABILITY_NONCE: ${RESTORE_DRILL_EXECUTOR_FIREWALL_CAPABILITY_NONCE:-unprepared}
      RESTORE_DRILL_EXECUTOR_SSLMODE: ${POSTGRES_SSLMODE:-}
      # This is a container path, never the host-config source path. The
      # noncredential CA root is required only when sslmode verifies it.
      RESTORE_DRILL_EXECUTOR_SSLROOTCERT_FILE: /run/configs/restore_drill_executor_ca.pem
      RESTORE_DRILL_EXECUTOR_APPLICATION_DB: ${POSTGRES_DB:-butlers}
      RESTORE_DRILL_EXECUTOR_MAINTENANCE_DB: ${RESTORE_DRILL_EXECUTOR_MAINTENANCE_DB:-postgres}
      RESTORE_DRILL_EXECUTOR_BACKUP_DIR: /backups
      RESTORE_DRILL_EXECUTOR_INTERVAL_S: ${RESTORE_DRILL_EXECUTOR_INTERVAL_S:-604800}
      RESTORE_DRILL_EXECUTOR_CHECK_INTERVAL_S: ${RESTORE_DRILL_EXECUTOR_CHECK_INTERVAL_S:-3600}
    volumes:
      - butlers_backups:/backups:ro
      # The root-owned wrapper prepares this directory before Compose creates
      # the executor, then writes the exact capability only after both bridge
      # policies are installed. A direct overlay launch cannot create a
      # runnable executor without that marker.
      - type: bind
        source: /run/butlers/restore-drill-firewall
        target: /run/butlers/restore-drill-firewall
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: restore_drill_executor_password
        target: restore_drill_executor_password
        mode: 0400
    configs:
      - source: restore_drill_executor_ca
        target: /run/configs/restore_drill_executor_ca.pem
        mode: 0444
    depends_on:
      migrations:
        condition: service_completed_successfully
      restore-drill-postgres-proxy:
        condition: service_started
    networks: [restore_drill_executor]
    # A transient host firewall fence must be installed before this credentialed
    # service starts, including after a Docker daemon or host restart.
    restart: "no"

secrets:
  # A host path is configuration, not the secret value. The private file is
  # provisioned outside git and mounted only by restore-drill-executor.
  restore_drill_executor_password:
    file: "${RESTORE_DRILL_EXECUTOR_PASSWORD_FILE:?Set RESTORE_DRILL_EXECUTOR_PASSWORD_FILE to the private secret file}"

configs:
  # This is not a credential. A deployment supplies a CA root through the
  # source-file setting only when it uses verify-ca or verify-full. The tracked
  # default is deliberately not a valid CA, so verification modes fail closed.
  restore_drill_executor_ca:
    file: "${RESTORE_DRILL_EXECUTOR_SSLROOTCERT_SOURCE_FILE:-./deploy/restore-drill-ca-unconfigured.pem}"

networks:
  # Only the uncredentialed relay joins this bridge. IPv6 is disabled so the
  # host's IPv4-only PostgreSQL allowlist remains a complete default deny.
  restore_drill_db:
    driver: bridge
    enable_ipv6: false
  # This limits the credentialed executor's network membership. The prepared
  # root-owned executor bridge policy allows only the created relay peer and
  # denies Docker-gateway and host traffic.
  restore_drill_executor:
    driver: bridge
    internal: true
    enable_ipv6: false
