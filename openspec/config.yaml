schema: spec-driven

context: |
  Tech stack: Python 3.12+, FastMCP, Claude Agent SDK, PostgreSQL (JSONB), Docker, asyncio
  Domain: AI agent framework — personal butler daemons with MCP-based communication
  Doctrine: about/heart-and-soul/ (vision.md defines 7 non-negotiable rules)
  Design contracts: about/legends-and-lore/rfcs/ (numbered RFCs; each carries its own status)
  OpenSpec workflow: new standalone changes use a repo-local schema. Use single-butler for an
  eligible change with no cross-butler contract, shared schema, or security boundary; design is
  optional there. Use living-specs when a design is required. Both keep the canonical specs as the
  living source of required behavior and create no change-local specs. Mark a new change using
  either schema with skip_specs: true in its generated .openspec.yaml, preserving schema and created.
  Keep spec-driven for retained multi-PR delta programs and changes that intentionally author local
  deltas. Do not retag existing changes or add skip_specs to legacy changes.
  When observable required behavior changes, update the governing canonical spec in the same change.
  Read existing designs; artifact readiness is not owner approval, implementation review, or evidence.

rules:
  proposal:
    - >
      Classify the actual scope. A cross-butler contract, shared-across-butlers schema, or security
      boundary requires a design. New standalone work without local delta specs uses single-butler
      when eligible or living-specs when design is required. Retained multi-PR delta programs keep
      spec-driven and their change-local requirements.
    - >
      For a new single-butler or living-specs change with no local specs, preserve the generated
      schema and created fields in .openspec.yaml and add skip_specs: true. Do not create a specs/
      directory as a placeholder. Never add this marker to an existing change or to a change with
      actual local deltas. A new no-delta change missing this marker or its generated schema/created
      metadata is not ready to continue; stop and correct that new change before proceeding.
  specs:
    - >
      Retained or intentionally selected spec-driven deltas use exact capability paths and standard
      ADDED/MODIFIED/REMOVED/RENAMED blocks. Every ADDED or MODIFIED requirement block carries
      "ID: REQ-<capability>-<NNN>", "Source: <doctrine or RFC grounding>", and
      "Scope: v1-mandatory|v1-reserved|post-v1"; scripts/check_requirement_trace_lines.py enforces
      this for active local deltas. Keep existing delta programs and their trace lines intact.
    - >
      Canonical specs and retained spec-driven deltas include a "## Source References" section at the
      end naming the doctrine principles and RFCs that ground the requirements. Keep these references
      with any required same-change canonical update.
    - >
      For other changes, the canonical files under openspec/specs/ are the maintained contracts.
      Update an affected canonical requirement in the same change when required behavior changes;
      do not copy it into a temporary delta solely to satisfy the old workflow.
  design:
    - >
      Record the behavior boundary, key decisions, alternatives and migration/compatibility concerns.
      Required for cross-butler contracts, shared schemas and security boundaries; optional for an
      eligible single-butler change.
