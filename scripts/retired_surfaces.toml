# Add a [[surface]] row with its owner bead and live replacement/survivor.
# scope uses Git pathspecs; regexes scan whole files, including multiline SQL.
[[surface]]
id = "contacts-tables"
kind = "pattern"
state = "retired"
pattern = '\b(?:FROM|JOIN|INTO|UPDATE|DELETE\s+FROM|REFERENCES)\s+(?:public\.)?(?:contacts|contact_info)\b'
scope = ["src/butlers", "roster"]
exclude_parts = ["migrations", "tests", "__pycache__"]
suffixes = [".py", ".sql"]
allow = [{path = "src/butlers/jobs/briefing.py", line_contains = "no JOIN contacts"}]
bead = "bu-oluyt.8"
survivor = "relationship.entity_facts + public.entities; tests/contracts/test_contacts_schema_retired.py::test_identity_resolver_reads_entity_facts"

