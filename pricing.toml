# OpenAI — sourced from https://developers.openai.com/api/docs/pricing/ (2026-04-28)
# gpt-5.5 and gpt-5.4 have two pricing tiers based on context length; entries below use the <272K tier.
# gpt-5.5 (>272K): $10.00/$45.00 per 1M tokens (cached input $1.00)
# gpt-5.4 (>272K): $5.00/$22.50 per 1M tokens
# gpt-5.4-pro (>272K): $60.00/$270.00 per 1M tokens
# gpt-5.5-pro has no long-context tier.

# GPT-5.6 estimates use OpenAI Standard API-equivalent token prices, independent
# of the active Codex subscription, so the dashboard remains a general usage
# heuristic. This deployment assumes every request is <=272K, so entries are
# deliberately flat rather than context-tiered.
# Source: https://developers.openai.com/api/docs/pricing (2026-08-01).
