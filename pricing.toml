# Per-model token pricing (USD per token)
# Used by dashboard cost estimation
#
# Prices sourced from vendor public pricing pages.
# Update this file when new models are released or prices change.
#
# Cache pricing fields (both optional, per model or per tier):
#   cached_input_price_per_token   — prompt-cache READS
#   cache_creation_price_per_token — prompt-cache WRITES
# When absent, the bucket bills at the full input rate (conservative
# fallback for vendors that don't discount cached tokens or whose
# discount is unknown).
#
# billing_class is optional for metered models. Declare `subscription` or
# `local` for known zero-marginal usage so it cannot be confused with a model
# missing from this file.
#
# Anthropic: cache reads = 0.1x input, 5-minute cache writes = 1.25x input.

[models]

