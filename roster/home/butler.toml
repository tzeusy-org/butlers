[butler]
name = "home"
port = 41108
description = "Smart home automation orchestrator for comfort, energy, and device management"

[butler.runtime_seed]
max_concurrent_sessions = 3
liveness_ttl_seconds = 300
route_contract_min = 1
route_contract_max = 1

[butler.db]
name = "butlers"
schema = "home"

[butler.switchboard]
url = "http://localhost:41100/mcp"

[modules.home_assistant]

# Maintenance schedules (memory_decay_sweep, memory_consolidation,
# memory_episode_cleanup, memory_purge_superseded, memory_consolidation_backfill)
# are module defaults self-registered by MemoryModule.on_startup — no
# [[butler.schedule]] block needed here. Add one only to override cadence.
[modules.memory]
groups = ["core", "preferences", "entity"]

[modules.contacts]
provider = "google"
include_other_contacts = false

[modules.contacts.sync]
enabled = true
run_on_startup = true
interval_minutes = 15
full_sync_interval_days = 6

[modules.approvals]

[[butler.schedule]]
name = "weekly-energy-digest"
cron = "0 9 * * 0"
dispatch_mode = "job"
job_name = "energy_digest"

[[butler.schedule]]
name = "environment-report"
cron = "0 8 * * *"
dispatch_mode = "job"
job_name = "environment_report"

[[butler.schedule]]
name = "device-health-check"
cron = "0 4 * * *"
dispatch_mode = "job"
job_name = "device_health_check"

[[butler.schedule]]
name = "maintenance-schedule-check"
cron = "0 10 * * 1"
dispatch_mode = "job"
job_name = "maintenance_schedule_check"

# Shared cross-butler weather/AQI/pollen context feed (bu-ep4ks.16): keyless
# Open-Meteo poll keyed off the owner's configured home location. Degrades
# honestly (no fetch attempted) when no home location is on file.
[[butler.schedule]]
name = "atmosphere-feed-refresh"
cron = "*/30 * * * *"
dispatch_mode = "job"
job_name = "atmosphere_feed_refresh"

[[butler.schedule]]
name = "daily_briefing_contribution"
cron = "55 6 * * *"
dispatch_mode = "job"
job_name = "daily_briefing_contribution"

# Situational context-bus producer (RFC 0009): deterministic, zero-LLM.
# Publishes `at_home` from fresh Home Assistant presence entities every 10
# minutes; a stale HA feed never asserts presence.
[[butler.schedule]]
name = "context_producer_home_presence"
cron = "*/10 * * * *"
dispatch_mode = "job"
job_name = "context_producer_home_presence"

[modules.google_drive]
