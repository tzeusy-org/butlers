[butler]
name = "finance"
port = 41105
description = "Personal finance specialist for receipts, bills, subscriptions, and transaction alerts."

[butler.runtime_seed]
max_concurrent_sessions = 3
liveness_ttl_seconds = 300
route_contract_min = 1
route_contract_max = 1
core_groups = [
    "infra",          # status, trigger, route.execute, tick, correct
    "state",          # state_get/set/delete/list — KV persistence
    "scheduling",     # schedule CRUD — dynamic reminders
    "sessions",       # sessions_list/get/summary/daily, top_sessions
    "notifications",  # notify, remind
    "media",          # get_attachment
    "temporal",       # deadlines, event_chains, seasonal_periods
    "delegation",     # delegate_ask/receive/answer/wake — cross-butler questions
    "domain_events",  # publish/subscribe/receive_domain_event — standing pub/sub
]

[butler.db]
name = "butlers"
schema = "finance"

[butler.switchboard]
url = "http://localhost:41100/mcp"

[modules.calendar]
provider = "google"
groups = ["butler_events"]

[modules.calendar.conflicts]
policy = "suggest"

# Maintenance schedules (memory_decay_sweep, memory_consolidation,
# memory_episode_cleanup, memory_purge_superseded, memory_consolidation_backfill)
# are module defaults self-registered by MemoryModule.on_startup — no
# [[butler.schedule]] block needed here. Add one only to override cadence.
[modules.memory]
groups = ["core", "entity"]

[modules.finance]
groups = ["core", "subscriptions", "bills", "analytics", "bulk", "intelligence", "budgets"]

# bu-rvz2o: the six direct-notify prompt-mode tasks that used to live here
# (upcoming-bills-check, subscription-renewal-alerts, monthly-spending-summary,
# anomaly-digest, budget-status-check, subscription-audit-monthly) called
# notify() directly, bypassing the insight broker's dedup/cooldown/quiet-hours/
# owner-verbosity machinery entirely. They have been absorbed into
# insight-scan (budget thresholds now respect each budget's own configured
# warn/alert thresholds; subscription price-change detection added) plus
# three new deterministic jobs below (bill-reconciliation-sweep,
# anomaly-insight-scan, monthly-finance-digest) that propose insight
# candidates instead of composing an LLM digest. See PR description for the
# full task -> disposition mapping.
[[butler.schedule]]
name = "insight-scan"
cron = "0 7 * * *"
dispatch_mode = "job"
job_name = "insight_scan"

[[butler.schedule]]
name = "bill-reconciliation-sweep"
cron = "15 21 * * 0"
dispatch_mode = "job"
job_name = "bill_reconciliation_sweep"

[[butler.schedule]]
name = "anomaly-insight-scan"
cron = "0 21 * * *"
dispatch_mode = "job"
job_name = "anomaly_insight_scan"

[[butler.schedule]]
name = "monthly-finance-digest"
cron = "0 9 1 * *"
dispatch_mode = "job"
job_name = "monthly_finance_digest"

[[butler.schedule]]
name = "daily_briefing_contribution"
cron = "55 6 * * *"
dispatch_mode = "job"
job_name = "daily_briefing_contribution"

[[butler.schedule]]
name = "calendar_overlay_contribution"
cron = "50 6 * * *"
dispatch_mode = "job"
job_name = "calendar_overlay_contribution"
