[butler]
name = "relationship"
port = 41102
description = "Personal CRM. Manages contacts, relationships, important dates, interactions, gifts, and reminders."

[butler.runtime_seed]
max_concurrent_sessions = 3
liveness_ttl_seconds = 300
route_contract_min = 1
route_contract_max = 1
core_groups = [
    "infra",          # status, trigger, route.execute, tick, correct
    "state",          # state_get/set/delete/list — KV persistence
    "scheduling",     # schedule CRUD — dynamic reminders
    "sessions",       # sessions_list/get/summary/daily, top_sessions
    "notifications",  # notify, remind
    "media",          # get_attachment
    "temporal",       # deadlines, event_chains, seasonal_periods
    "delegation",     # delegate_ask/receive/answer/wake — cross-butler questions
    "fleet_cases",    # find_open_case/open_case/contribute_case_evidence/propose_case_posture/close_case/read_case
    "cost_claims",    # typed cross-butler money claims; writes fenced by runtime role
]

[butler.db]
name = "butlers"
schema = "relationship"

[butler.switchboard]
url = "http://localhost:41100/mcp"

# Deterministic reminder jobs (bu-idc5mx.4): fixed templates over the existing reads, sent
# through the owner-notify boundary. No session, no model.
[[butler.schedule]]
name = "upcoming-dates-check"
cron = "0 8 * * *"
dispatch_mode = "job"
job_name = "upcoming_dates_check"

[[butler.schedule]]
name = "relationship-maintenance"
cron = "0 9 * * 1"
dispatch_mode = "job"
job_name = "relationship_maintenance"

[[butler.schedule]]
name = "daily_briefing_contribution"
cron = "55 6 * * *"
dispatch_mode = "job"
job_name = "daily_briefing_contribution"

[[butler.schedule]]
name = "calendar_overlay_contribution"
cron = "50 6 * * *"
dispatch_mode = "job"
job_name = "calendar_overlay_contribution"

[[butler.schedule]]
name = "calendar_prep_contribution"
cron = "52 6 * * *"
dispatch_mode = "job"
job_name = "calendar_prep_contribution"

[[butler.schedule]]
name = "meeting-debrief"
cron = "0 18 * * *"
dispatch_mode = "job"
job_name = "meeting_debrief"

[[butler.schedule]]
name = "insight-scan"
cron = "0 7 * * *"
dispatch_mode = "job"
job_name = "insight_scan"

[[butler.schedule]]
name = "interaction-sync"
cron = "30 6 * * *"
dispatch_mode = "job"
job_name = "interaction_sync"

[[butler.schedule]]
name = "loan-cost-claim-backfill"
cron = "35 4 * * *"
dispatch_mode = "job"
job_name = "loan_cost_claim_backfill"

[[butler.schedule]]
name = "memory-curation"
cron = "0 3 * * 0"
dispatch_mode = "job"
job_name = "memory_curation"

[[butler.schedule]]
name = "pending-actions-curation"
cron = "0 4 * * *"
dispatch_mode = "job"
job_name = "pending_actions_curation"

[[butler.schedule]]
name = "fact-retraction-curation"
cron = "0 5 * * 1"
dispatch_mode = "job"
job_name = "fact_retraction_curation"

[[butler.schedule]]
name = "prepared-action-orphan-sweep"
cron = "30 3 * * *"
dispatch_mode = "job"
job_name = "prepared_action_orphan_sweep"

[[butler.schedule]]
name = "entity-dedup-curation"
cron = "0 6 * * 2"
dispatch_mode = "job"
job_name = "entity_dedup_curation"

[[butler.schedule]]
name = "episodic-predicate-curation"
cron = "0 5 * * 3"
dispatch_mode = "job"
job_name = "episodic_predicate_curation"

[[butler.schedule]]
name = "email-identity-enrichment"
cron = "30 6 * * *"
dispatch_mode = "job"
job_name = "email_identity_enrichment"

# contact-info-reconciler retired in migration bead 10 (bu-e2ja9 / core_115):
# public.contact_info is dropped, so the dual-write reconciler has nothing to
# sweep. Re-adding it would throw UndefinedTableError every 30 minutes.

[modules.calendar]
response_enabled = true
provider = "google"
groups = ["core", "response"]

[modules.calendar.conflicts]
policy = "suggest"

[modules.contacts]
providers = [{type = "google"}, {type = "telegram"}]
include_other_contacts = false

# The only butler that syncs contacts (it owns entities); the roster test pins this.
[modules.contacts.sync]
enabled = true
run_on_startup = true
interval_minutes = 15
full_sync_interval_days = 6

# Maintenance schedules (memory_decay_sweep, memory_consolidation,
# memory_episode_cleanup, memory_purge_superseded, memory_consolidation_backfill)
# are module defaults self-registered by MemoryModule.on_startup — no
# [[butler.schedule]] block needed here. Add one only to override cadence.
[modules.memory]
groups = ["core", "feedback", "entity", "admin"]

[modules.approvals]
groups = ["actions"]
enabled = true

[modules.approvals.gated_tools.memory_reclassify]
risk_tier = "medium"

[modules.relationship]
# The enabled Relationship groups are manifesto-owned. The entity group adds
# exactly six reads; entity_write stays inactive, keeping all three grouped
# writes unavailable on this roster (owner decision bu-t89d9m, option A).
groups = [
    "contacts",
    "contacts_ingress",  # fixed owning backfill report/read; no legacy-group expansion
    "contacts_extended",
    "interactions",
    "relationships",
    "social",
    "notes",
    "tracking",
    "management",
    "entity",
]

# Google Drive module (optional — requires 'drive' scope on connected Google account).
# Enable by uncommenting and re-authorizing via /api/oauth/google/start?force_consent=true
# [modules.google_drive]
# account = ""              # Google account email (default: primary account)
# max_read_size_bytes = 10485760  # 10 MB cap for drive_read_file
# butler_folder_name = "butlers"  # root folder name at Drive root for butler outputs

# RFC 0015: core always registers the error relay; no module opt-in is required.

[modules.approvals.gated_tools.calendar_respond]
risk_tier = "medium"
