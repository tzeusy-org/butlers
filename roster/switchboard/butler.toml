[butler]
name = "switchboard"
port = 41100
description = "Routes incoming messages to specialist butlers"
type = "staffer"

[butler.permissions]
cross_butler_access = ["*"]

[butler.runtime_seed]
max_concurrent_sessions = 3
# Only register core tool groups the switchboard actually uses.
# Omitted groups (state, scheduling, sessions, media) had 0 LLM calls
# over 30 days per session tool_calls audit (2026-04-07).
core_groups = [
    "infra",                # status, trigger, route.execute, tick, correct
    "notifications",        # notify, remind
    "module_mgmt",          # module.states, module.set_enabled
    "switchboard_routing",  # ingest, route_to_butler, connector.heartbeat
    "switchboard_backfill", # backfill.poll, backfill.progress
]

[buffer]
queue_capacity = 100
worker_count = 3
scanner_interval_s = 30
scanner_grace_s = 10
scanner_batch_size = 50

[butler.db]
name = "butlers"
schema = "switchboard"

# Maintenance schedules (memory_decay_sweep, memory_consolidation,
# memory_episode_cleanup, memory_purge_superseded, memory_consolidation_backfill)
# are module defaults self-registered by MemoryModule.on_startup — no
# [[butler.schedule]] block needed here. Add one only to override cadence.
[modules.memory]
groups = ["core", "entity"]
[modules.pipeline]
enable_ingress_dedupe = true

[modules.switchboard]
groups = ["routing", "lifecycle"]

[modules.approvals]
groups = ["actions"]
enabled = true
default_expiry_hours = 72
default_risk_tier = "medium"

[modules.approvals.gated_tools.connector_disconnect]
risk_tier = "high"

[modules.insight_broker]

[modules.owner_conditions_broker]

# Google Drive module (optional — requires 'drive' scope on connected Google account).
# Enable by uncommenting and re-authorizing via /api/oauth/google/start?force_consent=true
# [modules.google_drive]
# account = ""              # Google account email (default: primary account)
# max_read_size_bytes = 10485760  # 10 MB cap for drive_read_file
# butler_folder_name = "butlers"  # root folder name at Drive root for butler outputs

# Butler registry liveness sweep
[[butler.schedule]]
name = "eligibility_sweep"
cron = "*/5 * * * *"
dispatch_mode = "job"
job_name = "eligibility_sweep"

# Proactive insight delivery — hold-until-first-active daily cadence
# (bu-ep4ks.9 slice 5). Ticks every 30 minutes across a 06:15-11:45 UTC
# window instead of a single fixed 08:00 UTC slot: delivery_cycle's
# daily_hold_mode=True holds the digest until the owner is first not
# suppressed by dnd/meeting/sleeping/quiet_hours, force-delivers past the
# hard fallback deadline (11:00 UTC — the 11:15/11:45 ticks in this window
# guarantee at least one attempt after it), and defers the whole digest on
# a travel day. Idempotent across ticks: once a tick delivers, candidates
# flip to status='delivered' and a later tick that morning simply finds
# nothing pending. Offset to :15/:45 (not :00/:30) so it never lands on the
# exact same tick as the hourly urgent sub-cycle below.
[[butler.schedule]]
name = "insight-delivery-cycle"
cron = "15,45 6-11 * * *"
dispatch_mode = "job"
job_name = "insight_delivery_cycle"

# Hourly urgent insight sub-cycle (bu-o8233, JARVIS pursuit move 8 slice 4) —
# priority>=90 candidates must not wait for the next daily hold-until-active
# window (bu-ep4ks.9 slice 5). Offset to :30 past the hour so it never lands
# on the exact same tick as the daily cycle above (both would still dispatch
# correctly if they did — the scheduler dispatches due tasks serially within
# one tick — but the offset avoids redundant back-to-back dispatches).
[[butler.schedule]]
name = "insight-urgent-subcycle"
cron = "30 * * * *"
dispatch_mode = "job"
job_name = "insight_urgent_subcycle"

# Commitment escalation tick (bu-n1evl, RFC 0026 §6-§9) — advances the L0-L3
# escalation clock for commitment-class owner_conditions, shortens the grace of
# deadline-bearing commitments, surfaces L1+ commitments at confidence >= 0.8
# through the insight engine, and asks the archival question for commitments
# stale at L3 for 90 days. Daily at 05:40 UTC: after spend-rule-savings (04:15)
# and before the insight delivery window opens (06:15), so a commitment that
# escalates overnight is queued in time for the same morning's digest rather
# than waiting a day. Offset off :00/:30 to avoid the eligibility_sweep (*/5)
# and insight-urgent-subcycle (:30) ticks.
[[butler.schedule]]
name = "commitment-escalation"
cron = "40 5 * * *"
dispatch_mode = "job"
job_name = "commitment_escalation"

# Spend rule 7-day savings computation (§5.4) — runs daily at 04:15 UTC (off-peak)
[[butler.schedule]]
name = "spend-rule-savings"
cron = "15 4 * * *"
dispatch_mode = "job"
job_name = "spend_rule_savings"

# Rule promotion trigger (bu-wuwy9, rule-promotion bead 3 of 7) — scans
# switchboard.routing_verdict_log for repeated LLM agreement per sender and
# proposes rule_promotion_suggestions rows (never mints ingestion_rules
# directly). Hourly, offset to :50 past the hour to avoid colliding with
# eligibility_sweep (*/5), insight-urgent-subcycle (:30), and
# spend-rule-savings (04:15).
[[butler.schedule]]
name = "rule-promotion-trigger"
cron = "50 * * * *"
dispatch_mode = "job"
job_name = "rule_promotion_trigger"

# Decision-review digest (bu-ckkpz.4, epic bu-ckkpz "Owner Decision Desk") —
# weekly digest of open owner-decision beads ("N decisions waiting, oldest
# Xd"), Monday 09:00 UTC. Reads the beads JSONL export bind-mounted into this
# container (see docker-compose.yml + butlers.jobs.decision_review's module
# docstring for why: no butler daemon has a live path to the Dolt/bd server).
[[butler.schedule]]
name = "decision-review-digest"
cron = "0 9 * * 1"
dispatch_mode = "job"
job_name = "decision_review_digest"

# P1/deploy decision-block age escalation (bu-ckkpz.4) — every 6h, escalates
# once (via the same notify/attention-ledger path, debounced through
# public.audit_log) when an open decision bead has blocked a P1 bug or a
# deploy-marked bead for more than 48h.
[[butler.schedule]]
name = "decision-escalation-check"
cron = "0 */6 * * *"
dispatch_mode = "job"
job_name = "decision_escalation_check"

# Domain-event-bus delivery reconciliation sweep (bu-1yw6d, PR #3585 review
# follow-up) — re-drives pending/failed public.domain_event_deliveries rows
# that a fresh publish's fan-out never resolved (crash after claim, or a
# route error). Every 10 minutes, offset to :03 past the hour so it never
# lands on the same tick as eligibility_sweep (*/5), insight-urgent-subcycle
# (:30), or rule-promotion-trigger (:50).
[[butler.schedule]]
name = "domain-event-reconciliation-sweep"
cron = "3,13,23,33,43,53 * * * *"
dispatch_mode = "job"
job_name = "domain_event_reconciliation_sweep"
