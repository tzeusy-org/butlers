# Publisher-owned domain-event contracts for the Switchboard butler (bu-q7vx1q.10).
# See roster/travel/domain_events.toml for the format and the ownership rule.

[[event]]
type = "switchboard.security_event"
schema_version = 1
summary = "A first-party identity provider sent an account-security alert (sign-in, password, 2-step, recovery, deletion)."
retention_policy = "minimized-derived"
reaction_expectation = "optional"
reaction_contract = """
Typed from sender and subject metadata only by a deterministic classifier that promoted \
ingestion rules cannot suppress. The payload names the provider, the alert kind, whether the \
sender authentication was confirmed, and the source request id; no message text, code, link, \
or mailbox address crosses the bus. Only an `authenticated` event warrants interrupting the \
owner; an `unverified` one is a quiet record."""
permitted_subscribers = []
required_fields = ["kind", "provider", "sender_verification", "source_request_id"]
optional_fields = ["provider_domain", "observed_at", "external_event_id"]

[[event]]
type = "switchboard.break_through_hit"
schema_version = 1
summary = "An accepted inbound message matched an owner-declared break-through clause."
retention_policy = "minimized-derived"
reaction_expectation = "optional"
reaction_contract = """
Decided at ingest by a deterministic evaluator over the sender entity, an authenticated sender \
domain, the channel and the account-security kind, independent of ingestion rules so a promoted \
skip rule cannot hide a hit. The payload names the clause, the channel, the resolved sender's \
display name when known, and the source request id; no message text, subject, snippet, address \
or link crosses the bus. A hit is announced once per (clause, source request); a connector \
replay emits nothing, and a hit whose announcement lapsed is announced again by the hourly sweep \
(at-least-once: consumers key on the clause and source request ids). The broker delivers the \
matching urgent candidate; the event itself sends nothing."""
permitted_subscribers = []
required_fields = ["clause_id", "channel", "source_request_id"]
optional_fields = ["sender_name"]
